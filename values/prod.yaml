        - Scribunto
        - SecureLinkFixer
        - SemanticMediaWiki
        - SemanticCompoundQueries
        - SemanticDependencyUpdater
        - SemanticDrilldown
        - SemanticExtraSpecialProperties
        - SemanticResultFormats
        - SemanticScribunto
        - SemanticWatchlist
        - SimpleBatchUpload
        - SimpleChanges
        - SimpleMathJax
