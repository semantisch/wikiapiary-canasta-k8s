instance:
  id: wikiapiary

image:
  repository: ghcr.io/canastawiki/canasta
  tag: "3.5.2"
  pullPolicy: IfNotPresent

domains:
  - wikiapiary.dobriy.ai

nodeSelector:
  kubernetes.io/hostname: dobriyai-hosting-1

web:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

caddy:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

varnish:
  enabled: true

db:
  enabled: true
  storage: 20Gi
  storageClass: local-path

elasticsearch:
  enabled: true
  image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2

jobrunner:
  enabled: true

extensionOverrides:
  enabled: true

ingress:
  enabled: true
  className: nginx
  tls: true
  annotations: {}
  certManager:
    enabled: true
    issuer: letsencrypt-prod

persistence:
  images:
    size: 20Gi
    storageClass: local-path
    accessMode: ReadWriteOnce
  extensions:
    size: 2Gi
    storageClass: local-path
    accessMode: ReadWriteOnce
  skins:
    size: 2Gi
    storageClass: local-path
    accessMode: ReadWriteOnce
  publicAssets:
    size: 2Gi
    storageClass: local-path
    accessMode: ReadWriteOnce

secrets:
  dbSecretName: wikiapiary-db-credentials
  mwSecretName: wikiapiary-mw-secrets

configData:
  web:
    .env: |
      HTTP_PORT=80
      HTTPS_PORT=443
      MYSQL_PASSWORD=
      MW_SITE_SERVER=https://wikiapiary.dobriy.ai
      MW_SITE_FQDN=wikiapiary.dobriy.ai
      CADDY_AUTO_HTTPS=off
      PHP_UPLOAD_MAX_FILESIZE=50M
      PHP_POST_MAX_SIZE=50M
      PHP_MAX_INPUT_VARS=1000
      CANASTA_ENABLE_ELASTICSEARCH=true
      CANASTA_ENABLE_VARNISH=true
      CANASTA_ENABLE_WIKI_DIRECTORY=false
      MW_SITEMAP_PAUSE_DAYS=1
      USE_EXTERNAL_DB=false
    wikis.yaml: |
      wikis:
        - id: main
          url: wikiapiary.dobriy.ai
          name: WikiApiary
    settings--global--Search.php: |
      <?php
      $wgSearchType = "CirrusSearch";
      $wgCirrusSearchServers = [ "elasticsearch" ];
    settings--global--01Namespaces.php: |
      <?php
      define( "NS_WIKI", 3800 );
      define( "NS_WIKI_TALK", 3801 );
      $wgExtraNamespaces[NS_WIKI] = "Wiki";
      $wgExtraNamespaces[NS_WIKI_TALK] = "Wiki_talk";
      $wgContentNamespaces[] = NS_WIKI;
      $wgNamespacesToBeSearchedDefault[NS_WIKI] = true;

      define( "NS_EXTENSION", 3802 );
      define( "NS_EXTENSION_TALK", 3803 );
      $wgExtraNamespaces[NS_EXTENSION] = "Extension";
      $wgExtraNamespaces[NS_EXTENSION_TALK] = "Extension_talk";
      $wgContentNamespaces[] = NS_EXTENSION;
      $wgNamespacesToBeSearchedDefault[NS_EXTENSION] = true;

      define( "NS_SKIN", 3804 );
      define( "NS_SKIN_TALK", 3805 );
      $wgExtraNamespaces[NS_SKIN] = "Skin";
      $wgExtraNamespaces[NS_SKIN_TALK] = "Skin_talk";
      $wgContentNamespaces[] = NS_SKIN;
      $wgNamespacesToBeSearchedDefault[NS_SKIN] = true;
    settings--global--02WikiApiarySite.php: |
      <?php
      $wgAllowExternalImages = true;
      $wgScribuntoDefaultEngine = 'luastandalone';
      $wgScribuntoUseGeSHi = true;
      $wgScribuntoUseCodeEditor = true;
      $wgHeaderTabsUseHistory = false;
      $wgHeaderTabsRenderSingleTab = true;
      $wgHeaderTabsEditTabLink = false;
    settings--global--03Permissions.php: |
      <?php
      $wgGroupPermissions['*']['edit'] = false;
      $wgGroupPermissions['*']['createaccount'] = false;
      $wgGroupPermissions['bot']['noratelimit'] = true;
      $wgGroupPermissions['bot']['delete'] = true;
    settings--global--04Branding.php: |
      <?php
      $wgLogos = [
          '1x' => "/w/resources/assets/WikiApiary_Bee.png",
          'icon' => "/w/resources/assets/WikiApiary_Bee.png",
      ];
      $wgFavicon = "/w/resources/assets/favicon.ico";

      $myWikiApiaryURL = "https://wikiapiary.dobriy.ai";
      $wgFooterIcons['monitoredby']['wikiapiary'] = [
          'src' => "/w/resources/assets/Monitored_by_WikiApiary.png",
          'url' => "$myWikiApiaryURL?pk_campaign=FooterIcon&pk_kwd=wikiapiary",
          'alt' => "Monitored by WikiApiary",
      ];
    settings--global--05WikiApiary.php: |
      <?php
      wfLoadExtension( 'WikiApiary' );
    settings--global--90Chameleon.php: |
      <?php
      $wgDefaultSkin = "chameleon";
      $egChameleonLayoutFile = $IP . '/skins/chameleon/layouts/fixedhead.xml';
    settings--global--settings.yaml: |
      extensions:
        - AJAXPoll
        - AWS
        - AbuseFilter
        - AdminLinks
        - AdvancedSearch
        - AntiSpoof
        - ApprovedRevs
        - Arrays
        - Babel
        - BetaFeatures
