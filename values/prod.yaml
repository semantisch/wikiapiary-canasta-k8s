instance:
  id: wikiapiary-live

image:
  repository: wikiapiary-legacy
  tag: "20260501-foreground"
  pullPolicy: IfNotPresent

domains:
  - wikiapiary.dobriy.ai
  - dev.wikiapiary.com

nodeSelector: {}

web:
  replicaCount: 2
  spreadAcrossNodes: true
  nodeSelector:
    wikiapiary-role: worker
  skipStartupUpdate: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 3Gi

caddy:
  replicaCount: 2
  spreadAcrossNodes: true
  nodeSelector:
    wikiapiary-role: worker
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

varnish:
  enabled: true
  replicaCount: 2
  spreadAcrossNodes: true
  nodeSelector:
    wikiapiary-role: worker

redis:
  enabled: true
  nodeSelector:
    wikiapiary-role: worker
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

cacheWarmer:
  enabled: true
  workerEnabled: true
  requestBaseUrl: "http://varnish"
  warmFanoutHost: "varnish-headless"
  nodeSelector:
    wikiapiary-role: worker
  discoverSchedule: "*/20 * * * *"
  warmSchedule: "*/5 * * * *"
  accessLogTail: 6000
  biggestWikisLimit: 100
  largestBatchSize: 20
  hotPagesLimit: 100
  semanticDiscoveryLimit: 50
  semanticSetLimit: 250
  recentChangesLimit: 30
  warmPagesLimit: 120
  queuePollSeconds: 5
  queueBatchSize: 60
  tier1RefreshSeconds: 900
  requestTimeoutSeconds: 15
  uncacheableTtlSeconds: 86400
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

db:
  enabled: true
  storage: 220Gi
  storageClass: local-path
  hostOverride: 10.43.137.104
  portOverride: "3306"
  nodeSelector:
    kubernetes.io/hostname: dobriyai-hosting-2
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 16Gi

elasticsearch:
  enabled: true
  image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
  storage: 40Gi
  storageClass: local-path
  javaOpts: "-Xms2g -Xmx2g"
  nodeSelector:
    kubernetes.io/hostname: dobriyai-hosting-2
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

jobrunner:
  enabled: true
  replicaCount: 2
  nodeSelector:
    wikiapiary-role: worker
  runJobsArgs: "--wait --maxjobs=100 --procs=4 --nothrottle"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

mail:
  existingSecret: wikiapiary-mail

extensionOverrides:
  enabled: false

ingress:
  enabled: true
  className: bunkerweb
  tls: false
  tlsHosts: []
  tlsSecretName: ""
  annotations:
    bunkerweb.io/KEEP_UPSTREAM_HEADERS: "Content-Security-Policy Permissions-Policy X-Frame-Options Cache-Control Referrer-Policy"
    bunkerweb.io/REVERSE_PROXY_HEADERS: "X-Forwarded-Proto $http_x_forwarded_proto;X-Forwarded-Protocol $http_x_forwarded_proto;X-Forwarded-Port 443"
    bunkerweb.io/REVERSE_PROXY_INTERCEPT_ERRORS: "yes"
    bunkerweb.io/SECURITY_MODE: "block"
    bunkerweb.io/USE_ANTIBOT: "no"
    bunkerweb.io/USE_BAD_BEHAVIOR: "no"
    bunkerweb.io/USE_BLACKLIST: "no"
    bunkerweb.io/USE_DNSBL: "no"
    bunkerweb.io/USE_LIMIT_REQ: "no"
    bunkerweb.io/USE_MODSECURITY: "yes"
    bunkerweb.io/USE_MODSECURITY_CRS: "no"
    bunkerweb.io/USE_WHITELIST: "no"
  edge:
    enabled: true
    namespace: bunkerweb
    className: nginx
    backendServiceName: bunkerweb-external
    backendServicePortName: http
    tls: true
    tlsHosts:
      - wikiapiary.dobriy.ai
    tlsSecretName: canasta-wikiapiary-tls
    annotations: {}
  certManager:
    enabled: true
    issuer: letsencrypt-prod

persistence:
  images:
    size: 10Gi
    storageClass: wikiapiary-live-rwx-static
    accessMode: ReadWriteMany
    volumeName: canasta-wikiapiary-live-rwx-images
  extensions:
    size: 2Gi
    storageClass: wikiapiary-live-rwx-static
    accessMode: ReadWriteMany
    volumeName: canasta-wikiapiary-live-rwx-extensions
  skins:
    size: 1Gi
    storageClass: wikiapiary-live-rwx-static
    accessMode: ReadWriteMany
    volumeName: canasta-wikiapiary-live-rwx-skins
  publicAssets:
    size: 1Gi
    storageClass: wikiapiary-live-rwx-static
    accessMode: ReadWriteMany
    volumeName: canasta-wikiapiary-live-rwx-public-assets
  cacheWarm:
    size: 512Mi
    storageClass: wikiapiary-live-rwx-static
    accessMode: ReadWriteMany
    volumeName: canasta-wikiapiary-live-rwx-cache-warm

sharedNfs:
  enabled: true
  service:
    clusterIP: 10.43.250.50
  storageClassName: wikiapiary-live-rwx-static
  backing:
    size: 20Gi
    storageClass: local-path
  nodeSelector:
    kubernetes.io/hostname: dobriyai-hosting-2

secrets:
  dbSecretName: wikiapiary-db-credentials
  mwSecretName: wikiapiary-mw-secrets

configData:
  db:
    my.cnf: |
      [client]
      default-character-set = utf8mb4

      [mysqld]
      character-set-server = utf8mb4
      collation-server = utf8mb4_general_ci
      max_allowed_packet = 1G
      innodb_buffer_pool_size = 6G
      max_heap_table_size = 256M
      tmp_table_size = 256M
      tmp_memory_table_size = 256M
