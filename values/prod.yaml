instance:
  id: wikiapiary

image:
  repository: ghcr.io/canastawiki/canasta
  tag: "3.5.2"
  pullPolicy: IfNotPresent

domains:
  - wikiapiary.dobriy.ai

nodeSelector:
  kubernetes.io/hostname: dobriyai-hosting-1

web:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

caddy:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

varnish:
  enabled: true

db:
  enabled: true
  storage: 20Gi
  storageClass: local-path

elasticsearch:
  enabled: true
  image: elasticsearch:7.10.2

jobrunner:
  enabled: true

ingress:
  enabled: true
  className: nginx
  tls: true
  annotations: {}
  certManager:
    enabled: true
    issuer: letsencrypt-prod

persistence:
  images:
    size: 20Gi
    storageClass: local-path
    accessMode: ReadWriteOnce
  extensions:
    size: 2Gi
    storageClass: local-path
    accessMode: ReadWriteOnce
  skins:
    size: 2Gi
    storageClass: local-path
    accessMode: ReadWriteOnce
  publicAssets:
    size: 2Gi
    storageClass: local-path
    accessMode: ReadWriteOnce

secrets:
  dbSecretName: wikiapiary-db-credentials
  mwSecretName: wikiapiary-mw-secrets

configData:
  web:
    .env: |
      HTTP_PORT=80
      HTTPS_PORT=443
      MYSQL_PASSWORD=
      MW_SITE_SERVER=https://wikiapiary.dobriy.ai
      MW_SITE_FQDN=wikiapiary.dobriy.ai
      CADDY_AUTO_HTTPS=off
      PHP_UPLOAD_MAX_FILESIZE=50M
      PHP_POST_MAX_SIZE=50M
      PHP_MAX_INPUT_VARS=1000
      CANASTA_ENABLE_ELASTICSEARCH=true
      CANASTA_ENABLE_VARNISH=true
      CANASTA_ENABLE_WIKI_DIRECTORY=false
      MW_SITEMAP_PAUSE_DAYS=1
      USE_EXTERNAL_DB=false
    wikis.yaml: |
      wikis:
        - id: main
          url: wikiapiary.dobriy.ai
          name: WikiApiary
    settings--global--Search.php: |
      <?php
      $wgSearchType = "CirrusSearch";
      $wgCirrusSearchServers = [ "elasticsearch" ];
    settings--global--settings.yaml: |
      extensions:
        - AJAXPoll
        - AWS
        - AbuseFilter
        - AdminLinks
        - AdvancedSearch
        - AntiSpoof
        - ApprovedRevs
        - Arrays
        - Babel
        - BetaFeatures
        - Bootstrap
        - BootstrapComponents
        - BreadCrumbs2
        - Cargo
        - CategoryTree
        - CharInsert
        - CheckUser
        - CirrusSearch
        - Cite
        - CiteThisPage
        - CodeEditor
        - CodeMirror
        - Collection
        - CommentStreams
        - CommonsMetadata
        - ConfirmAccount
        - ConfirmEdit
        - ContactPage
        - ContributionScores
        - CookieWarning
        - CreateRedirect
        - DataTransfer
        - DeleteBatch
        - Description2
        - Disambiguator
        - DiscussionTools
        - DismissableSiteNotice
        - DisplayTitle
        - Echo
        - EditAccount
        - Editcount
        - Elastica
        - EmailAuthorization
        - EmbedVideo
        - EventLogging
        - EventStreamConfig
        - ExternalData
        - FlexDiagrams
        - GTag
        - Gadgets
        - GlobalNotice
        - GoogleAnalyticsMetrics
        - GoogleDocCreator
        - HTMLTags
        - HeaderFooter
        - HeaderTabs
        - ImageMap
        - InlineComments
        - InputBox
        - Interwiki
        - JWTAuth
        - LDAPAuthentication2
        - LDAPAuthorization
        - LDAPProvider
        - LabeledSectionTransclusion
        - Lingo
        - LinkSuggest
        - LinkTarget
        - Linter
        - LockAuthor
        - Lockdown
        - LoginNotify
        - LookupUser
        - Loops
        - MagicNoCache
        - Maps
        - MassMessage
        - MassMessageEmail
        - Math
        - MediaUploader
        - Mermaid
        - MintyDocs
        - MobileFrontend
        - MsUpload
        - MultimediaViewer
        - MyVariables
        - NewUserMessage
        - Nuke
        - NumerAlpha
        - OATHAuth
        - OAuth
        - OpenGraphMeta
        - OpenIDConnect
        - PageExchange
        - PageForms
        - PageImages
        - PageSchemas
        - ParserFunctions
        - PdfHandler
        - PluggableAuth
        - Poem
        - Popups
        - QuickInstantCommons
        - RSS
        - RandomSelection
        - RegexFunctions
        - RegularTooltips
        - RelatedArticles
        - ReplaceText
        - RevisionSlider
        - RottenLinks
