        - Refreshed
        - Timeless
        - Vector
        - chameleon
  env:
    CADDY_AUTO_HTTPS: "off"
    PHP_UPLOAD_MAX_FILESIZE: "50M"
    PHP_POST_MAX_SIZE: "50M"
    PHP_MAX_INPUT_VARS: "1000"
    CANASTA_ENABLE_ELASTICSEARCH: "true"
    MW_SITEMAP_PAUSE_DAYS: "1"
  caddy:
    Caddyfile: |
      # Auto-generated for the hosting cluster GitOps deployment.
      import /etc/caddy/Caddyfile.global

      http://wikiapiary.dobriy.ai {
          import /etc/caddy/Caddyfile.site
          reverse_proxy varnish:80

          log {
              output file /var/log/caddy/access.log
          }
      }
    Caddyfile.site: |
      @wikiapiary_resource_assets path /w/resources/assets/WikiApiary_Bee.png /w/resources/assets/favicon.ico /w/resources/assets/Monitored_by_WikiApiary.png /w/resources/assets/wmf-cloud.png
      handle @wikiapiary_resource_assets {
          root * /srv/wiki-images/wikiapiary-assets
          uri strip_prefix /w/resources/assets
          file_server
      }

      handle_path /images/wikiapiary-assets/* {
          root * /srv/wiki-images/wikiapiary-assets
          file_server
      }
    Caddyfile.global: |
      # Global Caddy configuration for WikiApiary.

argocd:
  namespace: argocd
  repoURL: ""
  targetRevision: HEAD
  syncPolicy:
    automated: true
    selfHeal: true
    prune: true
