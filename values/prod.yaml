        - CategoryTree
        - CharInsert
        - CheckUser
        - CirrusSearch
        - Cite
        - CiteThisPage
        - CodeEditor
        - CodeMirror
        - Collection
        - CommentStreams
        - CommonsMetadata
        - ConfirmAccount
        - ConfirmEdit
        - ContactPage
        - ContributionScores
        - CookieWarning
        - CreateRedirect
        - DataTransfer
        - DeleteBatch
        - Description2
        - Disambiguator
        - DiscussionTools
        - DismissableSiteNotice
        - DisplayTitle
        - Echo
        - EditAccount
        - Editcount
        - Elastica
        - EmailAuthorization
        - EmbedVideo
        - EventLogging
        - EventStreamConfig
        - ExternalData
        - FlexDiagrams
        - GTag
        - Gadgets
        - GlobalNotice
        - GoogleAnalyticsMetrics
        - GoogleDocCreator
        - HTMLTags
        - HeaderFooter
        - HeaderTabs
        - ImageMap
        - InlineComments
        - InputBox
        - Interwiki
        - JWTAuth
        - LDAPAuthentication2
        - LDAPAuthorization
        - LDAPProvider
        - LabeledSectionTransclusion
