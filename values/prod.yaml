instance:
  id: wikiapiary-live

image:
  repository: wikiapiary-legacy
  tag: "20260501-foreground"
  pullPolicy: IfNotPresent

domains:
  - wikiapiary.dobriy.ai
  - dev.wikiapiary.com

nodeSelector:
  kubernetes.io/hostname: dobriyai-hosting-2

web:
  replicaCount: 1
  skipStartupUpdate: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 3Gi

caddy:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

varnish:
  enabled: true

db:
  enabled: true
  storage: 220Gi
  storageClass: local-path
  hostOverride: 10.43.137.104
  portOverride: "3306"
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 16Gi

elasticsearch:
  enabled: true
  image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
  storage: 40Gi
  storageClass: local-path
  javaOpts: "-Xms2g -Xmx2g"
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

jobrunner:
  enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

mail:
  existingSecret: wikiapiary-mail

extensionOverrides:
  enabled: false

ingress:
  enabled: true
  className: nginx
  tls: true
  annotations: {}
  certManager:
    enabled: true
    issuer: letsencrypt-prod

persistence:
  images:
    size: 10Gi
    storageClass: local-path
    accessMode: ReadWriteOnce
  extensions:
    size: 2Gi
    storageClass: local-path
    accessMode: ReadWriteOnce
  skins:
    size: 1Gi
    storageClass: local-path
    accessMode: ReadWriteOnce
  publicAssets:
    size: 1Gi
    storageClass: local-path
    accessMode: ReadWriteOnce

secrets:
  dbSecretName: wikiapiary-db-credentials
  mwSecretName: wikiapiary-mw-secrets

configData:
  db:
    my.cnf: |
      [client]
      default-character-set = utf8mb4

      [mysqld]
      character-set-server = utf8mb4
      collation-server = utf8mb4_general_ci
      max_allowed_packet = 1G
      innodb_buffer_pool_size = 6G
      max_heap_table_size = 256M
      tmp_table_size = 256M
      tmp_memory_table_size = 256M
  web:
    .env: |
      HTTP_PORT=80
      HTTPS_PORT=443
      MYSQL_PASSWORD=
      MW_SITE_SERVER=https://wikiapiary.dobriy.ai
      MW_SITE_FQDN=wikiapiary.dobriy.ai
      CADDY_AUTO_HTTPS=off
      PHP_UPLOAD_MAX_FILESIZE=100M
      PHP_POST_MAX_SIZE=100M
      PHP_MAX_INPUT_VARS=2000
      CANASTA_ENABLE_ELASTICSEARCH=true
      CANASTA_ENABLE_VARNISH=true
      CANASTA_ENABLE_WIKI_DIRECTORY=false
      MW_SITEMAP_PAUSE_DAYS=1
      USE_EXTERNAL_DB=false
    .smw.json: |
      {
        "main": {
          "upgrade_key": "d0fcfb45b30e3258611579e7ab8e39634d6f3cf6",
          "latest_version": "6.0.0",
          "incomplete_tasks": []
        },
        "mw_wikiapiary": {
          "upgrade_key": "d0fcfb45b30e3258611579e7ab8e39634d6f3cf6",
          "latest_version": "6.0.0",
          "incomplete_tasks": []
        }
      }
    wikis.yaml: |
      wikis:
        - id: main
          url: wikiapiary.dobriy.ai
          name: WikiApiary
    settings--global--00LegacySite.php: |
      <?php
      $wgSitename = "WikiApiary";
      $wgUsePathInfo = true;
      $wgScriptPath = "/w";
      $wgArticlePath = "/wiki/$1";
      $wgServer = "https://wikiapiary.dobriy.ai";
      $wgLogos = [
          '1x' => "/w/images/wikiapiary/thumb/5/5e/WikiApiary_Bee.png/128px-WikiApiary_Bee.png",
          'icon' => "/w/images/wikiapiary/thumb/5/5e/WikiApiary_Bee.png/128px-WikiApiary_Bee.png",
      ];
      $wgFavicon = "/w/images/wikiapiary/5/5e/WikiApiary_Bee.png";
      $wgEnableEmail = true;
      $wgEnableUserEmail = true;
      $wgEmergencyContact = "admin@wikiapiary.com";
      $wgPasswordSender = "admin@wikiapiary.com";
      $wgEnotifUserTalk = true;
      $wgEnotifWatchlist = true;
      $wgEmailAuthentication = true;
      $wgEmailConfirmToEdit = true;
      $wgDBname = "mw_wikiapiary";
      $wgDBuser = "mw_wikiapiary";
      $wgDBpassword = getenv( 'MYSQL_PASSWORD' ) ?: '';
      $wgDBTableOptions = "ENGINE=InnoDB, DEFAULT CHARSET=binary";
      $wgEnableUploads = true;
      $wgUploadDirectory = "{$IP}/images/wikiapiary";
      $wgUploadPath = "/w/images/wikiapiary";
      $wgUseImageMagick = true;
      $wgImageMagickConvertCommand = "/usr/bin/convert";
      $wgUseInstantCommons = false;
      $wgFileExtensions = array_merge( $wgFileExtensions, [
          'svg',
          'doc',
          'docx',
          'xls',
          'xlsx',
          'ppt',
          'pptx',
          'mp4',
          'gz',
          'pdf',
          'zip',
      ] );
      $wgGroupPermissions['autoconfirmed']['upload_by_url'] = true;
      $wgAllowCopyUploads = true;
      $wgLanguageCode = "en";
      $wgLocaltimezone = "UTC";
      $wgRightsPage = "";
      $wgRightsUrl = "http://creativecommons.org/licenses/by-sa/3.0/";
      $wgRightsText = "Creative Commons Attribution Share Alike";
      $wgRightsIcon = "/w/resources/assets/licenses/cc-by-sa.png";
      $wgCookiePrefix = "wikiapiary";
      $wgAllowUserCss = true;
      $wgAllowUserJs = true;
      $wgAllowSiteCSSOnRestrictedPages = true;
      $wgMiserMode = true;
      $wgEnableSidebarCache = true;
      $wgMainCacheType = CACHE_ACCEL;
      $wgSessionCacheType = CACHE_ACCEL;
      $wgSessionsInObjectCache = false;
      $wgEnableParserCache = true;
      $wgParserCacheExpireTime = 60 * 60 * 24 * 3;
      $wgMinimalPasswordLength = 8;
      $wgJobRunRate = 0;
      $wgMaxShellMemory = 524288;
      $wgRequestTimeLimit = 300;
      $wgCompressRevisions = true;
    settings--global--99Mail.php: |
      <?php
      $mailFrom = getenv( 'MW_MAIL_FROM' ) ?: '';
      $mailReplyTo = getenv( 'MW_MAIL_REPLYTO' ) ?: $mailFrom;
      if ( $mailFrom !== '' ) {
          $wgEmergencyContact = $mailFrom;
          $wgPasswordSender = $mailFrom;
          $wgNoReplyAddress = $mailReplyTo !== '' ? $mailReplyTo : $mailFrom;
      }
      $smtpHost = getenv( 'MW_SMTP_HOST' ) ?: '';
      if ( $smtpHost !== '' ) {
          $wgSMTP = [
              'host' => $smtpHost,
              'IDHost' => getenv( 'MW_SMTP_IDHOST' ) ?: ( parse_url( $wgServer, PHP_URL_HOST ) ?: 'wikiapiary.dobriy.ai' ),
              'port' => (int)( getenv( 'MW_SMTP_PORT' ) ?: '25' ),
              'auth' => filter_var( getenv( 'MW_SMTP_AUTH' ) ?: 'true', FILTER_VALIDATE_BOOLEAN ),
              'username' => getenv( 'MW_SMTP_USERNAME' ) ?: null,
              'password' => getenv( 'MW_SMTP_PASSWORD' ) ?: null,
          ];
          if ( getenv( 'MW_SMTP_STARTTLS' ) !== false && getenv( 'MW_SMTP_STARTTLS' ) !== '' ) {
              $wgSMTP['starttls'] = filter_var( getenv( 'MW_SMTP_STARTTLS' ), FILTER_VALIDATE_BOOLEAN );
          }
          if ( filter_var( getenv( 'MW_SMTP_TLS_INSECURE' ) ?: 'false', FILTER_VALIDATE_BOOLEAN ) ) {
              $wgSMTP['socket_options'] = [
                  'ssl' => [
                      'verify_peer' => false,
                      'verify_peer_name' => false,
                      'allow_self_signed' => true,
                  ],
              ];
          }
      }
    settings--global--01Namespaces.php: |
      <?php
      define( "NS_EXTENSION", 800 );
      define( "NS_EXTENSION_TALK", 801 );
      $wgExtraNamespaces[NS_EXTENSION] = "Extension";
      $wgExtraNamespaces[NS_EXTENSION_TALK] = "Extension_talk";
      $wgContentNamespaces[] = NS_EXTENSION;
      $wgNamespacesToBeSearchedDefault[NS_EXTENSION] = true;

      define( "NS_FARM", 802 );
      define( "NS_FARM_TALK", 803 );
      $wgExtraNamespaces[NS_FARM] = "Farm";
      $wgExtraNamespaces[NS_FARM_TALK] = "Farm_talk";
      $wgContentNamespaces[] = NS_FARM;
      $wgNamespacesToBeSearchedDefault[NS_FARM] = true;
      $wgNamespacesWithSubpages[NS_FARM] = true;

      define( "NS_SKIN", 804 );
      define( "NS_SKIN_TALK", 805 );
      $wgExtraNamespaces[NS_SKIN] = "Skin";
      $wgExtraNamespaces[NS_SKIN_TALK] = "Skin_talk";
      $wgContentNamespaces[] = NS_SKIN;
      $wgNamespacesToBeSearchedDefault[NS_SKIN] = true;

      define( "NS_GENERATOR", 808 );
      define( "NS_GENERATOR_TALK", 809 );
      $wgExtraNamespaces[NS_GENERATOR] = "Generator";
      $wgExtraNamespaces[NS_GENERATOR_TALK] = "Generator_talk";
      $wgContentNamespaces[] = NS_GENERATOR;
      $wgNamespacesToBeSearchedDefault[NS_GENERATOR] = true;
      $wgNamespacesWithSubpages[NS_GENERATOR] = true;

      define( "NS_HOST", 810 );
      define( "NS_HOST_TALK", 811 );
      $wgExtraNamespaces[NS_HOST] = "Host";
      $wgExtraNamespaces[NS_HOST_TALK] = "Host_talk";
      $wgContentNamespaces[] = NS_HOST;
      $wgNamespacesToBeSearchedDefault[NS_HOST] = true;
      $wgNamespacesWithSubpages[NS_HOST] = true;

      define( "NS_LIBRARY", 812 );
      define( "NS_LIBRARY_TALK", 813 );
      $wgExtraNamespaces[NS_LIBRARY] = "Library";
      $wgExtraNamespaces[NS_LIBRARY_TALK] = "Library_talk";
      $wgContentNamespaces[] = NS_LIBRARY;
      $wgNamespacesToBeSearchedDefault[NS_LIBRARY] = true;
      $wgNamespacesWithSubpages[NS_LIBRARY] = true;

      $wgNamespacesWithSubpages[NS_MAIN] = true;
      $wgNamespacesWithSubpages[NS_PROJECT] = true;
      $wgNamespacesWithSubpages[NS_TEMPLATE] = true;
    settings--global--02Permissions.php: |
      <?php
      $wgGroupPermissions['*']['edit'] = false;
      $wgGroupPermissions['*']['createaccount'] = true;
      $wgGroupPermissions['bot']['noratelimit'] = true;
      $wgGroupPermissions['bot']['delete'] = true;
      $wgRestrictionLevels[] = 'editors';
      $wgRestrictionLevels[] = 'operators';
      $wgGroupPermissions['user']['move'] = false;
      $wgGroupPermissions['trusted-users']['autopatrol'] = true;
      $wgGroupPermissions['trusted-users']['autoconfirmed'] = true;
      $wgGroupPermissions['trusted-users']['skipcaptcha'] = true;
      $wgGroupPermissions['editors']['autopatrol'] = true;
      $wgGroupPermissions['editors']['autoconfirmed'] = true;
      $wgGroupPermissions['editors']['skipcaptcha'] = true;
      $wgGroupPermissions['editors']['editors'] = true;
      $wgGroupPermissions['editors']['delete'] = true;
      $wgGroupPermissions['editors']['move'] = true;
      $wgGroupPermissions['editors']['suppressredirect'] = true;
      $wgGroupPermissions['operators']['autopatrol'] = true;
      $wgGroupPermissions['operators']['operators'] = true;
      $wgGroupPermissions['operators']['suppressredirect'] = true;
      $wgGroupPermissions['sysop']['editors'] = true;
      $wgGroupPermissions['sysop']['operators'] = true;
    settings--global--03Foreground.php: |
      <?php
      $wgDefaultSkin = "foreground";
      $wgForegroundFeatures = [
          'navbarIcon' => true,
          'showActionsForAnon' => true,
          'NavWrapperType' => 'divonly',
          'showHelpUnderTools' => true,
          'showRecentChangesUnderTools' => true,
          'IeEdgeCode' => 1,
          'showFooterIcons' => true,
      ];
      $egChameleonLayoutFile = $IP . '/skins/chameleon/layouts/fixedhead.xml';
    settings--global--04LegacyExtensions.php: |
      <?php
      $wgPFEnableStringFunctions = true;
      $wgScribuntoGatherFunctionStats = true;
      $wgScribuntoEngineConf['luasandbox']['cpuLimit'] = 30;
      $wgScribuntoUseGeSHi = true;
      $wgScribuntoUseCodeEditor = true;
      $wgPdfProcessor = 'gs';
      $wgPdfPostProcessor = $wgImageMagickConvertCommand;
      $wgPdfInfo = 'pdfinfo';
      wfLoadExtension( 'ConfirmEdit/QuestyCaptcha' );
      $wgCaptchaQuestions = [
          'What plant is the (old) MediaWiki logo supposed to be?' => [ 'Sunflower', 'a sunflower' ],
          'What programming language does Scribunto allow you to use in templates?' => [ 'Lua' ],
          'If you include wikicode like {{foo}} what page is included?' => [ 'Template:Foo' ],
          'What is the name of the special page that shows the latest changes on a wiki?' => [ 'Special:Recentchanges', 'Recentchanges', 'Recent changes' ],
          'What is the name of the online encyclopedia that made wikis famous?' => [ 'Wikipedia', 'english Wikipedia' ],
          'What sound does a cow make?' => [ 'Moo', 'Moo!' ],
          'What sound does a cat make?' => [ 'hiss', 'Meow', 'Meow!' ],
      ];
      $wgGroupPermissions['emailconfirmed']['skipcaptcha'] = true;
      $ceAllowConfirmedEmail = true;
      $wgGroupPermissions['sysop']['editwidgets'] = true;
      $wgGroupPermissions['translator']['translate'] = true;
      $wgGroupPermissions['user']['translate'] = true;
      $wgGroupPermissions['user']['translate-messagereview'] = true;
      $wgGroupPermissions['user']['translate-groupreview'] = true;
      $wgGroupPermissions['user']['translate-import'] = true;
      $wgGroupPermissions['sysop']['pagetranslation'] = true;
      $wgGroupPermissions['sysop']['translate-manage'] = true;
      $wgTranslateDocumentationLanguageCode = 'qqq';
      $wgExtraLanguageNames['qqq'] = 'Message documentation';
      $wgTranslateFuzzyBotName = 'Fuzzy Bee';
      $edgDBServer['apiary'] = "localhost";
      $edgDBServerType['apiary'] = "mysql";
      $edgDBName['apiary'] = "apiary";
      $edgDBUser['apiary'] = "apiary";
      $edgDBPass['apiary'] = getenv( 'MYSQL_PASSWORD' ) ?: '';
      enableSemantics( 'wikiapiary.dobriy.ai' );
      $smwgCheckForConstraintErrors = SMW_CONSTRAINT_ERR_CHECK_NONE;
      $smwgQEqualitySupport = SMW_EQ_NONE;
      $smwgNamespacesWithSemanticLinks[NS_EXTENSION] = true;
      $smwgNamespacesWithSemanticLinks[NS_FARM] = true;
      $smwgNamespacesWithSemanticLinks[NS_SKIN] = true;
      $smwgNamespacesWithSemanticLinks[NS_GENERATOR] = true;
      $smwgNamespacesWithSemanticLinks[NS_HOST] = true;
      $smwgNamespacesWithSemanticLinks[NS_LIBRARY] = true;
      $smwgPageSpecialProperties[] = '_CDAT';
      $smwgPageSpecialProperties[] = '_LEDT';
      $smwgQUpperbound = 30000;
      $smwgQMaxLimit = 30000;
      $smwgQMaxSize = 24;
      $smwgQMaxDepth = 16;
      $smwgQConceptMaxSize = 20;
      $smwgQConceptMaxDepth = 8;
      $smwgQueryResultCacheType = CACHE_ACCEL;
      $smwgQueryResultCacheLifetime = 60 * 60 * 24;
      $srfgArraySep = "\n";
      $srfgArrayPropSep = ',';
      $sespSpecialProperties = [
          '_PAGEID',
          '_CUSER',
          '_EUSER',
          '_NREV',
          '_TNREV',
          '_SUBP',
          '_USERREG',
      ];
      $sespUseAsFixedTables = true;
      $wgSESPExcludeBots = true;
      $wgPageFormsRenameMainEditTab = true;
      $wgPageFormsAutoCreateUser = 'Bumble Bee';
      $htRenderSingleTab = true;
      $htEditTabLink = false;
    settings--global--05Footer.php: |
      <?php
      $myWikiApiaryURL = "https://wikiapiary.dobriy.ai/wiki/WikiApiary";
      unset( $wgFooterIcons['poweredbysmw'] );
      $wgFooterIcons['monitoredby']['wikiapiary'] = [
          'src' => '/w/images/wikiapiary/b/b4/Monitored_by_WikiApiary.png',
          'url' => "$myWikiApiaryURL?pk_campaign=FooterIcon&pk_kwd=wikiapiary",
          'alt' => 'Monitored by WikiApiary',
      ];
      $wgFooterIcons['servedby']['mariadb'] = [
          'src' => '/mariadb-badge-88x31.png',
          'url' => 'https://mariadb.org',
          'alt' => 'Powered by MariaDB',
      ];
      $wgFooterIcons['poweredby']['semanticmediawiki'] = [
          'src' => '/smw-logo.png',
          'url' => 'https://www.semantic-mediawiki.org/wiki/Semantic_MediaWiki',
          'alt' => 'Powered by Semantic MediaWiki',
          'class' => 'smw-footer',
      ];
      $wgFooterIcons['servedby']['wmfcloud'] = [
          'src' => '/wmf-cloud.png',
          'url' => 'https://wikitech.wikimedia.org/wiki/Help:Cloud_Services_Introduction',
          'alt' => 'Served by Wikimedia Cloud Services',
      ];
    settings--global--settings.yaml: |
      extensions:
        - Bootstrap
        - ParserFunctions
        - WikiEditor
        - CodeEditor
        - SyntaxHighlight_GeSHi
        - Scribunto
        - PdfHandler
        - ConfirmEdit
        - SpamBlacklist
        - Gadgets
        - Widgets
        - UniversalLanguageSelector
        - Babel
        - Translate
        - Arrays
        - Variables
        - MyVariables
        - CSS
        - Disambiguator
        - MagicNoCache
        - ExternalData
        - Elastica
        - CirrusSearch
        - SemanticMediaWiki
        - SemanticResultFormats
        - SemanticExtraSpecialProperties
        - SemanticScribunto
        - SemanticRating
        - PageForms
        - HeaderTabs
      skins:
        - foreground
        - chameleon
    settings--wikis--main--99LegacyUploads.php: |
      <?php
      $wgUploadDirectory = "{$IP}/images/wikiapiary";
      $wgUploadPath = "/w/images/wikiapiary";
    settings--global--06Search.php: |
      <?php
      $wgSearchType = 'CirrusSearch';
      $wgCirrusSearchServers = [ '10.42.1.67' ];
      $wgDisableSearchUpdate = false;
      $wgSearchSuggestCacheExpiry = 60 * 60;
    settings--wikis--main--99DbOverride.php: |
      <?php
      $wgDBtype = 'mysql';
      $wgDBserver = '10.43.137.104';
      $wgDBname = 'mw_wikiapiary';
      $wgDBuser = 'mw_wikiapiary';
      $wgDBpassword = getenv( 'MYSQL_PASSWORD' ) ?: '';
      $edgDBServer['apiary'] = '10.43.137.104';
      $edgDBServerType['apiary'] = 'mysql';
      $edgDBName['apiary'] = 'apiary';
      $edgDBUser['apiary'] = 'apiary';
      $edgDBPass['apiary'] = getenv( 'MYSQL_PASSWORD' ) ?: '';
  env:
    CADDY_AUTO_HTTPS: "off"
    PHP_UPLOAD_MAX_FILESIZE: "100M"
    PHP_POST_MAX_SIZE: "100M"
    PHP_MAX_INPUT_VARS: "2000"
    CANASTA_ENABLE_ELASTICSEARCH: "true"
    MW_SITEMAP_PAUSE_DAYS: "1"
  caddy:
    Caddyfile: |
      import /etc/caddy/Caddyfile.global

      http://wikiapiary.dobriy.ai, http://dev.wikiapiary.com {
          import /etc/caddy/Caddyfile.site
          reverse_proxy varnish:80 {
              header_up Host wikiapiary.dobriy.ai
          }

          log {
              output file /var/log/caddy/access.log
          }
      }
    Caddyfile.site: |
      @legacy_root_assets path /wmf-cloud.png /mariadb-badge-88x31.png /smw-logo.png
      handle @legacy_root_assets {
          root * /srv/wiki-images/wikiapiary-assets
          file_server
      }
    Caddyfile.global: |
      # Global Caddy configuration for WikiApiary.

argocd:
  namespace: argocd
  repoURL: ""
  targetRevision: HEAD
  syncPolicy:
    automated: true
    selfHeal: true
    prune: true
