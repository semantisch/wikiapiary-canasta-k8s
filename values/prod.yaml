        - WSOAuth
        - WatchAnalytics
        - WhoIsWatching
        - WhosOnline
        - Widgets
        - WikiEditor
        - WikiSEO
        - cldr
      skins:
        - CologneBlue
        - MinervaNeue
        - Modern
        - MonoBook
        - Pivot
        - Refreshed
        - Timeless
        - Vector
        - chameleon
    settings--global--Vector.php: |
      <?php
      // Override Canasta's Vector default for this deployment.
      // The installed skin key here is "vector", not "vector-2022".
      $wgDefaultSkin = "vector";
      wfLoadSkin( 'Vector' );
  env:
    CADDY_AUTO_HTTPS: "off"
    PHP_UPLOAD_MAX_FILESIZE: "50M"
    PHP_POST_MAX_SIZE: "50M"
    PHP_MAX_INPUT_VARS: "1000"
    CANASTA_ENABLE_ELASTICSEARCH: "true"
    MW_SITEMAP_PAUSE_DAYS: "1"
  caddy:
    Caddyfile: |
      # Auto-generated for the hosting cluster GitOps deployment.
      import /etc/caddy/Caddyfile.global

      http://wikiapiary.dobriy.ai {
          import /etc/caddy/Caddyfile.site
          reverse_proxy varnish:80

          log {
              output file /var/log/caddy/access.log
          }
      }
    Caddyfile.site: |
      # Site-level Caddy configuration for WikiApiary.
    Caddyfile.global: |
      # Global Caddy configuration for WikiApiary.

argocd:
  namespace: argocd
  repoURL: ""
  targetRevision: HEAD
  syncPolicy:
    automated: true
    selfHeal: true
    prune: true
