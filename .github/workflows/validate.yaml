name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Helm and policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-ci.txt

      - name: Lint chart and values schema
        run: helm lint charts/canasta -f values/prod.yaml

      - name: Validate production monitor retries
        run: python3 scripts/test-smoke-production.py

      - name: Verify proxy failure recovery and write safety
        run: |
          docker create --name caddy-test caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          docker cp caddy-test:/usr/bin/caddy "$RUNNER_TEMP/caddy"
          docker rm caddy-test
          chmod +x "$RUNNER_TEMP/caddy"
          CADDY_BIN="$RUNNER_TEMP/caddy" python3 scripts/test-proxy-recovery.py

      - name: Validate scoped BunkerWeb discovery
        run: python3 operations/bunkerweb-controller/test_scope.py

      - name: Render production manifests
        run: helm template canasta-wikiapiary charts/canasta -f values/prod.yaml > /tmp/wikiapiary-rendered.yaml

      - name: Validate GitOps and primaryHost-only cutover invariants
        run: python3 scripts/validate-gitops.py /tmp/wikiapiary-rendered.yaml

      - name: Validate cache-warmer scripts and behavior
        run: python3 scripts/validate-cache-warmer.py /tmp/wikiapiary-rendered.yaml

      - name: Verify homepage refresh serves cached content without waiting
        run: |
          python3 scripts/render-homepage-cache-test.py > "$RUNNER_TEMP/homepage-grace.vtc"
          docker run --rm --entrypoint varnishtest \
            -v "$RUNNER_TEMP/homepage-grace.vtc:/test.vtc:ro" \
            varnish:7.0.2-alpine@sha256:136ebffb7de1b5f1b16ec07b2225088d5b888cb434c4484b684e06e634c19aa2 \
            -t 15 /test.vtc
