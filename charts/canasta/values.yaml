# Default values for the Canasta Helm chart.

# Instance identity
instance:
  id: ""

# Canasta image
image:
  repository: ghcr.io/canastawiki/canasta
  tag: ""               # defaults to chart appVersion if empty
  pullPolicy: IfNotPresent

# Public site identity. primaryHost drives MediaWiki, Caddy, cache warming, and
# ingress routing. additionalHosts are accepted aliases during migrations.
site:
  primaryHost: localhost
  additionalHosts: []

# Pod placement
nodeSelector: {}

# Web tier
web:
  replicaCount: 1
  spreadAcrossNodes: false
  nodeSelector: {}
  skipStartupUpdate: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Caddy (reverse proxy + wiki farm routing)
caddy:
  image: caddy:2.10.2-alpine
  replicaCount: 1
  spreadAcrossNodes: false
  nodeSelector: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Varnish cache
varnish:
  enabled: true
  image: varnish:7.0.2-alpine
  replicaCount: 1
  spreadAcrossNodes: false
  nodeSelector: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Redis (shared object/session/parser cache)
redis:
  enabled: false
  image: redis:7.2-alpine
  nodeSelector: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

# PHP session backend
phpSessions:
  enabled: false
  redisHost: redis
  redisPort: 6379
  redisDatabase: 10
  redisPrefix: "PHPREDIS_SESSION:"

# Cache warmer
cacheWarmer:
  enabled: false
  workerEnabled: false
  suspend: false
  image: ""
  requestBaseUrl: "http://varnish"
  warmFanoutHost: ""
  nodeSelector: {}
  discoverSchedule: "*/20 * * * *"
  priorityWarmSchedule: "*/1 * * * *"
  warmSchedule: "*/5 * * * *"
  startingDeadlineSeconds: 120
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  discoverActiveDeadlineSeconds: 300
  priorityActiveDeadlineSeconds: 300
  warmActiveDeadlineSeconds: 600
  accessLogTail: 4000
  biggestWikisLimit: 100
  largestBatchSize: 20
  hotPagesLimit: 80
  priorityHotPagesLimit: 20
  semanticDiscoveryLimit: 40
  semanticSetLimit: 200
  recentChangesLimit: 25
  warmPagesLimit: 120
  priorityPagesLimit: 80
  queuePollSeconds: 5
  queueBatchSize: 60
  tier1RefreshSeconds: 900
  requestTimeoutSeconds: 15
  uncacheableTtlSeconds: 86400
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

# Database (MariaDB)
# Set db.enabled=false and externalDatabase settings to use an external DB.
db:
  enabled: true
  image: mariadb:11.4
  storage: 10Gi
  storageClass: ""
  hostOverride: ""
  portOverride: ""
  nodeSelector: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# External database (when db.enabled=false)
externalDatabase:
  host: ""
  port: "3306"
  user: "root"
  ssl: "false"

# Elasticsearch (optional)
elasticsearch:
  enabled: false
  image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
  storage: 5Gi
  storageClass: ""
  javaOpts: "-Xms512m -Xmx512m"
  nodeSelector: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Job runner
jobrunner:
  enabled: true
  replicaCount: 1
  nodeSelector: {}
  runJobsArgs: "--wait --maxjobs=10"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Mail transport
mail:
  existingSecret: ""

# Ingress
ingress:
  enabled: true
  className: ""
  tls: true
  backendServiceName: caddy
  tlsHosts: []
  tlsSecretName: ""
  annotations: {}
  edge:
    enabled: false
    nameOverride: ""
    namespace: bunkerweb
    className: nginx
    backendServiceName: bunkerweb-external
    backendServicePortName: http
    tls: true
    tlsHosts: []
    tlsSecretName: ""
    annotations: {}
  certManager:
    enabled: false
    issuer: letsencrypt-prod

# Persistent volumes
# For multi-node multi-replica web pods, set storageClass to a
# ReadWriteMany provisioner (e.g. nfs, efs) AND set accessMode to
# ReadWriteMany. The default ReadWriteOnce is correct for single-node
# clusters and for multi-replica deployments where all pods can be
# scheduled to the same node. See `canasta storage setup --help` for
# the available shared-storage commands.
persistence:
  images:
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
    volumeName: ""
  extensions:
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
    volumeName: ""
  skins:
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
    volumeName: ""
  publicAssets:
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
    volumeName: ""
  cacheWarm:
    size: 256Mi
    storageClass: ""
    accessMode: ReadWriteOnce
    volumeName: ""

sharedNfs:
  enabled: false
  image: itsthenetwork/nfs-server-alpine:12
  service:
    clusterIP: ""
  storageClassName: ""
  backing:
    size: 20Gi
    storageClass: ""
  nodeSelector: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Secrets — names of K8s Secrets created by Ansible (not stored here)
secrets:
  dbSecretName: ""      # set by Ansible: <instance_id>-db-credentials
  mwSecretName: ""      # set by Ansible: <instance_id>-mw-secrets

# Config data — populated by Ansible or committed via gitops.
# Helm renders these into ConfigMaps for each component.
# When empty, ConfigMaps are not created (allows external management).
configData:
  web: {}       # .env, wikis.yaml, settings--*--*.php, composer.local.json
  env: {}       # allowlisted env vars extracted from .env, one per ConfigMap key
  caddy: {}     # Caddyfile, Caddyfile.site, Caddyfile.global
  varnish: {}   # default.vcl
  db: {}        # my.cnf

extensionOverrides:
  enabled: false

# Argo CD
argocd:
  namespace: argocd
  repoURL: ""
  targetRevision: HEAD
  syncPolicy:
    automated: true
    selfHeal: true
    prune: true
