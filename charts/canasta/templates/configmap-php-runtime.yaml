apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "canasta.fullname" . }}-php-runtime
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
data:
  zz-wikiapiary-runtime.conf: |
    [www]
    ; Bound total web request time, including blocked database and network I/O.
    ; CLI maintenance and job runners are not affected by the FPM setting.
    request_terminate_timeout = 70s
    request_terminate_timeout_track_finished = yes
