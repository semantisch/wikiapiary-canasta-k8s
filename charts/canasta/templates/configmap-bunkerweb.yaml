{{- if and .Values.ingress.enabled .Values.ingress.bunkerweb.enabled }}
{{- $root := . }}
{{- range $host := (include "canasta.hosts" . | fromJsonArray) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "canasta.fullname" $root }}-waf-{{ sha256sum $host | trunc 8 }}-upstream
  namespace: {{ include "canasta.namespace" $root }}
  labels:
    {{- include "canasta.labels" $root | nindent 4 }}
  annotations:
    bunkerweb.io/CONFIG_TYPE: server-http
    bunkerweb.io/CONFIG_SITE: {{ $host | quote }}
data:
  wikiapiary-upstream.conf: |
    # The headless Caddy Service resolves to independent ready replicas.
    # Do not enable non_idempotent: a POST already sent must never be replayed.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "canasta.fullname" $root }}-waf-{{ sha256sum $host | trunc 8 }}-response
  namespace: {{ include "canasta.namespace" $root }}
  labels:
    {{- include "canasta.labels" $root | nindent 4 }}
  annotations:
    bunkerweb.io/CONFIG_TYPE: modsec
    bunkerweb.io/CONFIG_SITE: {{ $host | quote }}
data:
  wikiapiary-response.conf: |
    # Wiki pages intentionally describe software and security. Inspect incoming
    # requests, without treating article text returned by MediaWiki as an attack.
    SecResponseBodyAccess Off
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "canasta.fullname" $root }}-waf-{{ sha256sum $host | trunc 8 }}-mediawiki
  namespace: {{ include "canasta.namespace" $root }}
  labels:
    {{- include "canasta.labels" $root | nindent 4 }}
  annotations:
    bunkerweb.io/CONFIG_TYPE: modsec-crs
    bunkerweb.io/CONFIG_SITE: {{ $host | quote }}
data:
  wikiapiary-mediawiki.conf: |
    # ResourceLoader accepts registered module names, not filesystem paths.
    # Keep traversal and every other argument inspected.
    SecRule REQUEST_FILENAME "@streq /w/load.php" "id:1111110,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:modules "@rx ^[A-Za-z0-9_.|,-]+$" "t:none,ctl:ruleRemoveTargetById=930120;ARGS:modules"

    # /wiki/ is the article router. A title ending in .com is not an executable.
    SecRule REQUEST_FILENAME "@beginsWith /wiki/" "id:1111111,phase:1,pass,nolog,t:none,ctl:ruleRemoveById=920440"

    # /Whois is an ordinary imported wiki subpage, not a shell command.
    SecRule REQUEST_FILENAME "@streq /w/index.php" "id:1111112,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:title "@rx /Whois$" "t:none,ctl:ruleRemoveTargetById=932340;ARGS:title"
    SecRule REQUEST_FILENAME "@streq /w/index.php" "id:1111113,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:target "@rx /Whois$" "t:none,ctl:ruleRemoveTargetById=932340;ARGS:target"
    SecRule REQUEST_FILENAME "@streq /w/index.php" "id:1111114,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:returnto "@rx /Whois$" "t:none,ctl:ruleRemoveTargetById=932340;ARGS:returnto"
    SecRule REQUEST_FILENAME "@streq /w/api.php" "id:1111115,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@streq feedrecentchanges" "t:none,chain"
        SecRule ARGS:target "@rx /Whois$" "t:none,ctl:ruleRemoveTargetById=932340;ARGS:target"

    # SMW's subject browser sends JSON with a dir option and arbitrary page names.
    # Literal titles such as "User Guide Database (...)" also match SQL-name
    # heuristics. Exclude these observed rules only from this action's params.
    SecRule REQUEST_FILENAME "@streq /w/api.php" "id:1111116,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@streq smwbrowse" "t:none,chain"
        SecRule ARGS:browse "@streq subject" "t:none,ctl:ruleRemoveTargetById=932380;ARGS:params,ctl:ruleRemoveTargetById=942190;ARGS:params,ctl:ruleRemoveTargetById=942140;ARGS:params,ctl:ruleRemoveTargetById=942151;ARGS:params,ctl:ruleRemoveTargetById=933160;ARGS:params"

    # Special:Browse receives the same literal /Whois title in article.
    SecRule REQUEST_FILENAME "@streq /w/index.php" "id:1111121,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:title "@streq Special:Browse" "t:none,chain"
        SecRule ARGS:article "@rx /Whois$" "t:none,ctl:ruleRemoveTargetById=932340;ARGS:article"

    # Login links carry a wiki title and a nested query string as navigation data.
    SecRule REQUEST_FILENAME "@streq /w/index.php" "id:1111117,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:title "@rx ^Special:(?:UserLogin|CreateAccount)$" "t:none,ctl:ruleRemoveTargetById=932330;ARGS:returnto,ctl:ruleRemoveTargetById=932125;ARGS:returnto,ctl:ruleRemoveTargetById=932235;ARGS:returntoquery,ctl:ruleRemoveTargetById=932380;ARGS:returntoquery"

    # A.I.M.$_(...) is a wiki title. Exclude this one filename-only PHP heuristic.
    SecRule REQUEST_FILENAME "@beginsWith /wiki/A.I.M.$_(" "id:1111118,phase:2,pass,nolog,t:none,ctl:ruleRemoveTargetById=933180;REQUEST_FILENAME"

    # Revision queries use pipes between literal wiki titles. A title beginning
    # with Script after that separator is not a shell command. Limit the
    # exception to the observed rule, action, property and titles argument.
    SecRule REQUEST_FILENAME "@streq /w/api.php" "id:1111119,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@streq query" "t:none,chain"
        SecRule ARGS:prop "@streq revisions" "t:none,ctl:ruleRemoveTargetById=932235;ARGS:titles,ctl:ruleRemoveTargetById=933160;ARGS:titles,ctl:ruleRemoveTargetById=942140;ARGS:titles,ctl:ruleRemoveTargetById=942151;ARGS:titles,ctl:ruleRemoveTargetById=942190;ARGS:titles"

    # A literal page name such as System (wiki.bunnfamily.nz) is not a PHP call.
    SecRule REQUEST_FILENAME "@streq /w/api.php" "id:1111120,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@streq edit" "t:none,ctl:ruleRemoveTargetById=933160;ARGS:title,ctl:ruleRemoveTargetById=942140;ARGS:title,ctl:ruleRemoveTargetById=942151;ARGS:title,ctl:ruleRemoveTargetById=942190;ARGS:title"

    # libinjection mistakes this exact reviewed wiki title for a SQL expression.
    # Retain libinjection for every other title and every other argument.
    SecRule REQUEST_FILENAME "@streq /w/api.php" "id:1111122,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@streq query" "t:none,chain"
        SecRule ARGS:prop "@streq revisions" "t:none,chain"
          SecRule ARGS:titles "@streq Rick and Morty Time (rickandmortytime.com)" "t:none,ctl:ruleRemoveTargetById=942100;ARGS:titles"
    SecRule REQUEST_FILENAME "@streq /w/api.php" "id:1111123,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@streq edit" "t:none,chain"
        SecRule ARGS:title "@streq Rick and Morty Time (rickandmortytime.com)" "t:none,ctl:ruleRemoveTargetById=942100;ARGS:title"

    # Edit and purge use the same literal titles as revision reads.
    SecRule REQUEST_FILENAME "@streq /w/api.php" "id:1111127,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@streq edit" "t:none,chain"
        SecRule ARGS:title "@rx ^(?!.*(?:\$\(|`))[^<>{}\[\]\x00-\x1f]+$" "t:none,ctl:ruleRemoveTargetById=932230;ARGS:title,ctl:ruleRemoveTargetById=932250;ARGS:title,ctl:ruleRemoveTargetById=932125;ARGS:title,ctl:ruleRemoveTargetById=932380;ARGS:title,ctl:ruleRemoveTargetById=932370;ARGS:title"
    SecRule REQUEST_FILENAME "@streq /w/api.php" "id:1111128,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@streq purge" "t:none,chain"
        SecRule ARGS:titles "@rx ^(?!.*(?:\$\(|`))[^<>{}\[\]\x00-\x1f]+$" "t:none,ctl:ruleRemoveTargetById=932230;ARGS:titles,ctl:ruleRemoveTargetById=932250;ARGS:titles,ctl:ruleRemoveTargetById=932125;ARGS:titles,ctl:ruleRemoveTargetById=932380;ARGS:titles,ctl:ruleRemoveTargetById=932370;ARGS:titles,ctl:ruleRemoveTargetById=932235;ARGS:titles,ctl:ruleRemoveTargetById=933160;ARGS:titles,ctl:ruleRemoveTargetById=942140;ARGS:titles,ctl:ruleRemoveTargetById=942151;ARGS:titles,ctl:ruleRemoveTargetById=942190;ARGS:titles"

    # Reviewed Newsbin bot subpages contain the literal substring bin/ex.
    # Limit this shell-signature exception to the exact profile and subpages.
    SecRule REQUEST_FILENAME "@streq /w/api.php" "id:1111130,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@streq query" "t:none,chain"
        SecRule ARGS:prop "@streq revisions" "t:none,chain"
          SecRule ARGS:titles "@rx ^Newsbin(?:/(?:General|Extensions|Libraries|Skins|Interwikimap|Namespaces|Statistics[ _]snapshot))?(?:\|Newsbin(?:/(?:General|Extensions|Libraries|Skins|Interwikimap|Namespaces|Statistics[ _]snapshot))?)*$" "t:none,ctl:ruleRemoveTargetById=932160;ARGS:titles"
    SecRule REQUEST_FILENAME "@streq /w/api.php" "id:1111131,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@streq edit" "t:none,chain"
        SecRule ARGS:title "@rx ^Newsbin(?:/(?:General|Extensions|Libraries|Skins|Interwikimap|Namespaces|Statistics[ _]snapshot))?$" "t:none,ctl:ruleRemoveTargetById=932160;ARGS:title"
    SecRule REQUEST_FILENAME "@streq /w/api.php" "id:1111132,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@streq purge" "t:none,chain"
        SecRule ARGS:titles "@rx ^Newsbin(?:/(?:General|Extensions|Libraries|Skins|Interwikimap|Namespaces|Statistics[ _]snapshot))?$" "t:none,ctl:ruleRemoveTargetById=932160;ARGS:titles"

    # The imported BASE64 profile name is not the base64 executable.
    SecRule REQUEST_FILENAME "@streq /w/index.php" "id:1111133,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:title "@streq BASE64_Tecnologia_-_Wiki/Whois" "t:none,ctl:ruleRemoveTargetById=932260;ARGS:title"

    # Content is data in these fields. MediaWiki supplies authentication, CSRF
    # checks, permissions and sanitisation. Other arguments remain inspected.
    # Phase 2 is needed to see action and text in POST form bodies.
    # Batch revision titles contain pipe separators and literal names such as
    # IRB WikiDesk, Diff.wiki and MMC Manuals. These are not shell pipelines.
    # Markup, control characters and command substitution remain inspected.
    SecRule REQUEST_FILENAME "@streq /w/api.php" "id:1111124,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@streq query" "t:none,chain"
        SecRule ARGS:prop "@streq revisions" "t:none,chain"
          SecRule ARGS:titles "@rx ^(?!.*(?:\$\(|`))[^<>{}\[\]\x00-\x1f]+$" "t:none,ctl:ruleRemoveTargetById=932230;ARGS:titles,ctl:ruleRemoveTargetById=932250;ARGS:titles,ctl:ruleRemoveTargetById=932125;ARGS:titles,ctl:ruleRemoveTargetById=932380;ARGS:titles,ctl:ruleRemoveTargetById=932370;ARGS:titles"

    # Stored wiki source may describe local URLs and contain HTML metadata.
    # These fields are content, not a server fetch URL or HTTP header.
    SecRule REQUEST_FILENAME "@streq /w/api.php" "id:1111125,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@rx ^(?:edit|parse|visualeditor|visualeditoredit)$" "t:none,ctl:ruleRemoveTargetById=934110;ARGS:text,ctl:ruleRemoveTargetById=921130;ARGS:text,ctl:ruleRemoveTargetById=934110;ARGS:appendtext,ctl:ruleRemoveTargetById=921130;ARGS:appendtext,ctl:ruleRemoveTargetById=934110;ARGS:prependtext,ctl:ruleRemoveTargetById=921130;ARGS:prependtext"

    # Rendering a Whois subpage does not invoke the whois command.
    SecRule REQUEST_FILENAME "@streq /w/api.php" "id:1111126,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@streq parse" "t:none,chain"
        SecRule ARGS:page "@rx /Whois$" "t:none,ctl:ruleRemoveTargetById=932340;ARGS:page"

    SecRule REQUEST_FILENAME "@rx ^/w/api\.php$" "id:1111101,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@rx ^(?:edit|parse|visualeditor|visualeditoredit)$" "ctl:ruleRemoveTargetByTag=attack-xss;ARGS:text,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:text,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:text,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:text,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:text,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:text,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:appendtext,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:appendtext,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:appendtext,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:appendtext,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:appendtext,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:appendtext,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:prependtext,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:prependtext,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:prependtext,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:prependtext,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:prependtext,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:prependtext,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:html,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:html,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:html,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:html,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:html,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:html,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:summary,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:summary,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:summary,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:summary,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:summary,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:summary,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:sectiontitle,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:sectiontitle,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:sectiontitle,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:sectiontitle,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:sectiontitle,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:sectiontitle"

    SecRule REQUEST_FILENAME "@rx ^/w/index\.php$" "id:1111102,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@rx ^(?:edit|submit)$" "ctl:ruleRemoveTargetByTag=attack-xss;ARGS:wpTextbox1,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:wpTextbox1,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:wpTextbox1,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:wpTextbox1,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:wpTextbox1,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:wpTextbox1,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:wpTextbox2,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:wpTextbox2,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:wpTextbox2,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:wpTextbox2,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:wpTextbox2,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:wpTextbox2,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:wpSummary,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:wpSummary,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:wpSummary,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:wpSummary,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:wpSummary,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:wpSummary"

    # Passwords are arbitrary strings. Do not confuse their contents with code.
    # Keep the rest of each login/create-account request under CRS inspection.
    SecRule REQUEST_FILENAME "@rx ^/(?:w/(?:api|index)\.php|wiki/Special:(?:UserLogin|CreateAccount))$" "id:1111103,phase:2,pass,nolog,t:none,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:lgpassword,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:lgpassword,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:lgpassword,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:lgpassword,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:lgpassword,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:lgpassword,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:password,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:password,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:password,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:password,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:password,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:password,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:wpPassword,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:wpPassword,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:wpPassword,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:wpPassword,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:wpPassword,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:wpPassword,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:wpRetype,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:wpRetype,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:wpRetype,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:wpRetype,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:wpRetype,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:wpRetype,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:retype,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:retype,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:retype,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:retype,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:retype,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:retype"
{{- end }}
{{- end }}
