{{- if and .Values.ingress.enabled .Values.ingress.bunkerweb.enabled }}
{{- $root := . }}
{{- range $host := (include "canasta.hosts" . | fromJsonArray) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "canasta.fullname" $root }}-waf-{{ sha256sum $host | trunc 8 }}-response
  namespace: {{ include "canasta.namespace" $root }}
  labels:
    {{- include "canasta.labels" $root | nindent 4 }}
  annotations:
    bunkerweb.io/CONFIG_TYPE: modsec
    bunkerweb.io/CONFIG_SITE: {{ $host | quote }}
data:
  wikiapiary-response.conf: |
    # Wiki pages intentionally describe software and security. Inspect incoming
    # requests, without treating article text returned by MediaWiki as an attack.
    SecResponseBodyAccess Off
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "canasta.fullname" $root }}-waf-{{ sha256sum $host | trunc 8 }}-mediawiki
  namespace: {{ include "canasta.namespace" $root }}
  labels:
    {{- include "canasta.labels" $root | nindent 4 }}
  annotations:
    bunkerweb.io/CONFIG_TYPE: modsec-crs
    bunkerweb.io/CONFIG_SITE: {{ $host | quote }}
data:
  wikiapiary-mediawiki.conf: |
    # Content is data in these fields. MediaWiki supplies authentication, CSRF
    # checks, permissions and sanitisation. Other arguments remain inspected.
    # Phase 2 is needed to see action and text in POST form bodies.
    SecRule REQUEST_FILENAME "@rx ^/w/api\.php$" "id:1111101,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@rx ^(?:edit|parse|visualeditor|visualeditoredit)$" "ctl:ruleRemoveTargetByTag=attack-xss;ARGS:text,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:text,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:text,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:text,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:text,ctl:ruleRemoveTargetByTag=attack-php;ARGS:text,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:appendtext,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:appendtext,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:appendtext,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:appendtext,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:appendtext,ctl:ruleRemoveTargetByTag=attack-php;ARGS:appendtext,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:prependtext,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:prependtext,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:prependtext,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:prependtext,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:prependtext,ctl:ruleRemoveTargetByTag=attack-php;ARGS:prependtext,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:html,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:html,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:html,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:html,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:html,ctl:ruleRemoveTargetByTag=attack-php;ARGS:html,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:summary,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:summary,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:summary,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:summary,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:summary,ctl:ruleRemoveTargetByTag=attack-php;ARGS:summary,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:sectiontitle,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:sectiontitle,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:sectiontitle,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:sectiontitle,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:sectiontitle,ctl:ruleRemoveTargetByTag=attack-php;ARGS:sectiontitle"

    SecRule REQUEST_FILENAME "@rx ^/w/index\.php$" "id:1111102,phase:2,pass,nolog,t:none,chain"
      SecRule ARGS:action "@rx ^(?:edit|submit)$" "ctl:ruleRemoveTargetByTag=attack-xss;ARGS:wpTextbox1,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:wpTextbox1,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:wpTextbox1,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:wpTextbox1,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:wpTextbox1,ctl:ruleRemoveTargetByTag=attack-php;ARGS:wpTextbox1,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:wpTextbox2,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:wpTextbox2,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:wpTextbox2,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:wpTextbox2,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:wpTextbox2,ctl:ruleRemoveTargetByTag=attack-php;ARGS:wpTextbox2,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:wpSummary,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:wpSummary,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:wpSummary,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:wpSummary,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:wpSummary,ctl:ruleRemoveTargetByTag=attack-php;ARGS:wpSummary"

    # Passwords are arbitrary strings. Do not confuse their contents with code.
    # Keep the rest of each login/create-account request under CRS inspection.
    SecRule REQUEST_FILENAME "@rx ^/(?:w/(?:api|index)\.php|wiki/Special:(?:UserLogin|CreateAccount))$" "id:1111103,phase:2,pass,nolog,t:none,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:lgpassword,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:lgpassword,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:lgpassword,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:lgpassword,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:lgpassword,ctl:ruleRemoveTargetByTag=attack-php;ARGS:lgpassword,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:password,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:password,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:password,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:password,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:password,ctl:ruleRemoveTargetByTag=attack-php;ARGS:password,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:wpPassword,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:wpPassword,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:wpPassword,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:wpPassword,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:wpPassword,ctl:ruleRemoveTargetByTag=attack-php;ARGS:wpPassword,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:wpRetype,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:wpRetype,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:wpRetype,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:wpRetype,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:wpRetype,ctl:ruleRemoveTargetByTag=attack-php;ARGS:wpRetype,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:retype,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:retype,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:retype,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:retype,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:retype,ctl:ruleRemoveTargetByTag=attack-php;ARGS:retype"
{{- end }}
{{- end }}
