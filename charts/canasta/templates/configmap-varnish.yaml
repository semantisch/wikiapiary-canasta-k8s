apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "canasta.fullname" . }}-varnish-config
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: varnish
data:
  readiness.sh: |
    #!/bin/sh
    set -eu
    nc -z 127.0.0.1 80
    if [ -f /tmp/wikiapiary-homepage-warm ]; then
      exit 0
    fi
    headers=$(mktemp)
    trap 'rm -f "$headers"' EXIT
    {{- range $host := (include "canasta.hosts" . | fromJsonArray) }}
    wget -q -S -T 20 -t 1 -O /dev/null --header={{ printf "Host: %s" $host | quote }} \
      http://127.0.0.1/wiki/Main_Page 2>"$headers"
    grep -qi 'X-WikiApiary-Cache: HIT' "$headers"
    {{- end }}
    touch /tmp/wikiapiary-homepage-warm
  {{- $primaryHost := include "canasta.primaryHost" . }}
  {{- if .Values.configData.varnish }}
  {{- range $key, $value := .Values.configData.varnish }}
  {{ $key }}: |
    {{- $value | replace "__PRIMARY_HOST__" $primaryHost | nindent 4 }}
  {{- end }}
  {{- else }}
  default.vcl: |
    {{- .Files.Get "files/default.vcl" | replace "__PRIMARY_HOST__" $primaryHost | nindent 4 }}
  {{- end }}
