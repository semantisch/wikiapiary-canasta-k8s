{{- if .Values.cacheWarmer.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "canasta.fullname" . }}-cache-warmer
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
data:
  discover.php: |
    <?php
    error_reporting(E_ALL);
    date_default_timezone_set('UTC');

    $baseDir = getenv('WARM_CACHE_DIR') ?: '/warm-cache';
    $accessLog = getenv('ACCESS_LOG_FILE') ?: $baseDir . '/access.log';
    $hotFile = $baseDir . '/hot-pages.json';
    $largestFile = $baseDir . '/largest-pages.json';
    $semanticFile = $baseDir . '/semantic-pages.json';
    $seedFile = $baseDir . '/seed-pages.json';
    $translationFile = $baseDir . '/translation-pages.json';
    $stateFile = $baseDir . '/discovery-state.json';
    $siteServer = rtrim(getenv('SITE_SERVER') ?: 'https://wikiapiary.dobriy.ai', '/');
    $warmBaseUrl = rtrim(getenv('WARM_BASE_URL') ?: $siteServer, '/');
    $warmHostHeader = getenv('WARM_HOST_HEADER') ?: '';
    $siteHost = getenv('SITE_HOST') ?: parse_url($siteServer, PHP_URL_HOST);
    $discoverBaseUrl = rtrim(getenv('DISCOVER_BASE_URL') ?: $siteServer, '/');
    $discoverHostHeader = getenv('DISCOVER_HOST_HEADER') ?: '';
    $accessTail = max(100, (int)(getenv('ACCESS_LOG_TAIL') ?: 4000));
    $biggestWikisLimit = max(10, (int)(getenv('BIGGEST_WIKIS_LIMIT') ?: 100));
    $hotLimit = max(10, (int)(getenv('HOT_PAGES_LIMIT') ?: 80));
    $semanticLimit = max(10, (int)(getenv('SEMANTIC_DISCOVERY_LIMIT') ?: 40));
    $semanticSetLimit = max(20, (int)(getenv('SEMANTIC_SET_LIMIT') ?: 200));
    $requestTimeout = max(3, (int)(getenv('REQUEST_TIMEOUT_SECONDS') ?: 15));

    @mkdir($baseDir, 0775, true);

    function atomic_write_json($path, $data) {
        $tmp = $path . '.tmp';
        file_put_contents($tmp, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
        rename($tmp, $path);
    }

    function load_json($path, $default) {
        if (!is_file($path)) {
            return $default;
        }
        $data = json_decode((string)file_get_contents($path), true);
        return is_array($data) ? $data : $default;
    }

    function tail_lines($path, $limit) {
        if (!is_file($path)) {
            return [];
        }
        $lines = [];
        $fp = fopen($path, 'r');
        if (!$fp) {
            return [];
        }
        while (($line = fgets($fp)) !== false) {
            $lines[] = rtrim($line, "\r\n");
            if (count($lines) > $limit) {
                array_shift($lines);
            }
        }
        fclose($fp);
        return $lines;
    }

    function should_skip_ua($ua) {
        if (!is_string($ua) || $ua === '') {
            return false;
        }
        return (bool)preg_match('/WikiApiaryCacheWarmer|WikiApiaryCacheDiscovery|bot|crawl|spider|slurp|GPTBot|GoogleOther|bingbot|Ahrefs|Semrush|curl\//i', $ua);
    }

    function wiki_path_from_title($title) {
        $title = str_replace(' ', '_', $title);
        $encoded = rawurlencode($title);
        return '/wiki/' . str_replace(['%2F', '%3A'], ['/', ':'], $encoded);
    }

    function eligible_warm_path($url) {
        if (!is_string($url) || $url === '') {
            return false;
        }
        if ($url === '/') {
            return true;
        }
        if (strpos($url, '/wiki/') !== 0) {
            return false;
        }
        if (preg_match('#^/wiki/Special:#', $url)) {
            return false;
        }
        foreach ([
            '/wiki/Template:',
            '/wiki/Module:',
            '/wiki/User:',
            '/wiki/Talk:',
            '/wiki/File:',
            '/wiki/Category:',
            '/wiki/Concept:',
            '/wiki/Property:'
        ] as $blocked) {
            if (strpos($url, $blocked) === 0) {
                return false;
            }
        }
        if (preg_match('/(::|[<>{}\[\]])/', $url)) {
            return false;
        }
        return true;
    }

    function fetch_text($url, $timeout, array $extraHeaders = []) {
        $ctx = stream_context_create([
            'http' => [
                'timeout' => $timeout,
                'ignore_errors' => true,
                'header' => implode("\r\n", array_merge([
                    'User-Agent: WikiApiaryCacheDiscovery/1.0'
                ], $extraHeaders))
            ],
            'ssl' => [
                'verify_peer' => false,
                'verify_peer_name' => false
            ]
        ]);
        $data = @file_get_contents($url, false, $ctx);
        return $data === false ? '' : $data;
    }

    function fetch_json_url($url, $timeout, array $extraHeaders = []) {
        $data = fetch_text($url, $timeout, $extraHeaders);
        if ($data === '') {
            return [];
        }
        $json = json_decode($data, true);
        return is_array($json) ? $json : [];
    }

    function fetch_valid_language_codes($siteServer, $timeout, array $extraHeaders = []) {
        $codes = [];
        $data = fetch_json_url(
            $siteServer . '/w/api.php?action=query&meta=siteinfo&siprop=languages&format=json',
            $timeout,
            $extraHeaders
        );
        foreach (($data['query']['languages'] ?? []) as $lang) {
            if (!empty($lang['code']) && is_string($lang['code'])) {
                $codes[strtolower($lang['code'])] = true;
            }
        }
        return $codes;
    }

    function discover_translation_pages($siteServer, array $sourcePages, array $validLanguageCodes, $timeout, array $extraHeaders = []) {
        $translations = [];
        foreach ($sourcePages as $url) {
            if (!eligible_warm_path($url) || strpos($url, '/wiki/') !== 0) {
                continue;
            }
            $title = str_replace('_', ' ', rawurldecode(substr($url, strlen('/wiki/'))));
            $data = fetch_json_url(
                $siteServer . '/w/api.php?action=query&list=allpages&apprefix=' . rawurlencode($title . '/') . '&aplimit=max&format=json',
                $timeout,
                $extraHeaders
            );
            foreach (($data['query']['allpages'] ?? []) as $page) {
                $translatedTitle = $page['title'] ?? '';
                if (!is_string($translatedTitle) || strpos($translatedTitle, $title . '/') !== 0) {
                    continue;
                }
                $suffix = substr($translatedTitle, strlen($title . '/'));
                $suffixKey = strtolower($suffix);
                if ($suffix === '' || !isset($validLanguageCodes[$suffixKey])) {
                    continue;
                }
                $translatedUrl = wiki_path_from_title($translatedTitle);
                if (eligible_warm_path($translatedUrl)) {
                    $translations[] = $translatedUrl;
                }
            }
        }
        $translations = array_values(array_unique($translations));
        sort($translations);
        return $translations;
    }

    function discover_seed_pages($siteServer, $timeout, array $extraHeaders = []) {
        $html = fetch_text($siteServer . '/wiki/Main_Page', $timeout, $extraHeaders);
        $raw = fetch_text($siteServer . '/wiki/Main_Page?action=raw', $timeout, $extraHeaders);
        $urls = ['/wiki/Main_Page'];

        if ($html !== '') {
            foreach ([
                '/<div id=[\'"]navwrapper[\'"].*?<\/nav>/s',
                '/<div id="mw-content-text".*?<\/div>\s*<\/div>/s'
            ] as $pattern) {
                if (!preg_match($pattern, $html, $match)) {
                    continue;
                }
                if (preg_match_all('/href="([^"]+)"/', $match[0], $hrefs)) {
                    foreach ($hrefs[1] as $href) {
                        if (strpos($href, '/wiki/') === 0 && eligible_warm_path($href)) {
                            $urls[] = html_entity_decode($href, ENT_QUOTES);
                        }
                    }
                }
            }
        }

        if ($raw !== '' && preg_match_all('/\[\[(.+?)(\|.+?)?\]\]/', $raw, $wikilinks)) {
            foreach ($wikilinks[1] as $target) {
                $target = preg_replace('/^<tvar\|[^>]+>/', '', $target);
                $target = preg_replace('/<\/?>/', '', $target);
                $target = trim($target);
                if ($target === '' || strpos($target, '#') === 0) {
                    continue;
                }
                if (strpos($target, 'Special:MyLanguage/') === 0) {
                    $target = substr($target, strlen('Special:MyLanguage/'));
                }
                if (preg_match('/(::|[<>{}\[\]])/', $target)) {
                    continue;
                }
                $url = wiki_path_from_title($target);
                if (eligible_warm_path($url)) {
                    $urls[] = $url;
                }
            }
        }

        $initial = array_values(array_unique($urls));
        foreach ($initial as $seedUrl) {
            $seedTitle = rawurldecode(substr($seedUrl, strlen('/wiki/')));
            $seedRaw = fetch_text($siteServer . $seedUrl . '?action=raw', $timeout, $extraHeaders);
            if ($seedRaw === '' || !preg_match_all('/\[\[(.+?)(\|.+?)?\]\]/', $seedRaw, $wikilinks)) {
                continue;
            }
            foreach ($wikilinks[1] as $target) {
                $target = preg_replace('/^<tvar\|[^>]+>/', '', $target);
                $target = preg_replace('/<\/?>/', '', $target);
                $target = trim($target);
                if ($target === '' || strpos($target, '#') === 0) {
                    continue;
                }
                if (strpos($target, 'Special:MyLanguage/') === 0) {
                    $target = substr($target, strlen('Special:MyLanguage/'));
                }
                if (preg_match('/(::|[<>{}\[\]])/', $target)) {
                    continue;
                }

                $isRelated = false;
                if (strpos($target, $seedTitle . '/') === 0 || strpos($target, $seedTitle . ' ') === 0) {
                    $isRelated = true;
                } elseif (strpos($seedTitle, ':') !== false) {
                    $seedNamespace = strstr($seedTitle, ':', true) . ':';
                    if (strpos($target, $seedNamespace) === 0) {
                        $isRelated = true;
                    }
                }

                if (!$isRelated) {
                    continue;
                }

                $url = wiki_path_from_title($target);
                if (eligible_warm_path($url)) {
                    $urls[] = $url;
                }
            }
        }

        $urls = array_values(array_unique($urls));
        sort($urls);
        return $urls;
    }

    $discoverHeaders = [];
    if ($discoverHostHeader !== '') {
        $discoverHeaders[] = 'Host: ' . $discoverHostHeader;
    }

    $seedPages = discover_seed_pages($discoverBaseUrl, $requestTimeout, $discoverHeaders);
    atomic_write_json($seedFile, [
        'generatedAt' => gmdate('c'),
        'pages' => $seedPages
    ]);

    $largestScores = [];
    $largestPages = [];
    $largestQuery = rawurlencode('[[Category:Website]] [[Is active::true]]|?Has pages count=total pages|sort=Has pages count|order=desc|limit=' . $biggestWikisLimit);
    $largestData = fetch_json_url(
        $discoverBaseUrl . '/w/api.php?action=ask&query=' . $largestQuery . '&format=json',
        $requestTimeout,
        $discoverHeaders
    );
    foreach (($largestData['query']['results'] ?? []) as $result) {
        if (!is_array($result) || empty($result['fulltext'])) {
            continue;
        }
        $url = wiki_path_from_title($result['fulltext']);
        if (!eligible_warm_path($url)) {
            continue;
        }
        $largestPages[] = $url;
        $largestScores[$url] = (int)($result['printouts']['total pages'][0] ?? 0);
    }
    $largestPages = array_values(array_unique($largestPages));
    atomic_write_json($largestFile, [
        'generatedAt' => gmdate('c'),
        'pages' => $largestPages,
        'scores' => $largestScores
    ]);

    $counts = [];
    foreach (tail_lines($accessLog, $accessTail) as $line) {
        $entry = json_decode($line, true);
        if (!is_array($entry)) {
            continue;
        }
        $request = $entry['request'] ?? [];
        $uri = $request['uri'] ?? '';
        $method = strtoupper($request['method'] ?? '');
        $host = $request['host'] ?? '';
        $status = (int)($entry['status'] ?? 0);
        $headers = $request['headers'] ?? [];
        $ua = '';
        if (isset($headers['User-Agent'][0])) {
            $ua = $headers['User-Agent'][0];
        }

        if ($host !== $siteHost || ($method !== 'GET' && $method !== 'HEAD') || $status < 200 || $status >= 400) {
            continue;
        }
        if (should_skip_ua($ua)) {
            continue;
        }
        if (!eligible_warm_path($uri)) {
            continue;
        }
        if (strpos($uri, '?') !== false || strpos($uri, '#') !== false) {
            continue;
        }
        $counts[$uri] = ($counts[$uri] ?? 0) + 1;
    }

    arsort($counts);
    $hotPages = array_slice(array_keys($counts), 0, $hotLimit);
    atomic_write_json($hotFile, [
        'generatedAt' => gmdate('c'),
        'pages' => $hotPages,
        'scores' => array_slice($counts, 0, $hotLimit, true)
    ]);

    $validLanguageCodes = fetch_valid_language_codes($discoverBaseUrl, $requestTimeout, $discoverHeaders);
    $translationPages = discover_translation_pages(
        $discoverBaseUrl,
        array_values(array_unique(array_merge($seedPages, array_slice($hotPages, 0, min(20, $hotLimit))))),
        $validLanguageCodes,
        $requestTimeout,
        $discoverHeaders
    );
    atomic_write_json($translationFile, [
        'generatedAt' => gmdate('c'),
        'pages' => $translationPages,
        'codes' => array_keys($validLanguageCodes)
    ]);

    $semanticState = load_json($stateFile, []);
    $knownSemantic = load_json($semanticFile, ['pages' => []]);
    $knownMap = [];
    foreach (($knownSemantic['pages'] ?? []) as $url) {
        if (eligible_warm_path($url)) {
            $knownMap[$url] = time();
        }
    }

    $candidates = array_values(array_unique(array_merge($seedPages, array_slice($hotPages, 0, $semanticLimit))));
    foreach ($candidates as $url) {
        $title = substr($url, strlen('/wiki/'));
        $rawUrl = $discoverBaseUrl . '/wiki/' . $title . '?action=raw';
        $raw = fetch_text($rawUrl, $requestTimeout, $discoverHeaders);
        if ($raw === '' || !eligible_warm_path($url)) {
            continue;
        }
        if (preg_match('/#ask:|#show:|Special:Ask|format=table|format=datatable/i', $raw)) {
            $knownMap[$url] = time();
        }
    }

    arsort($knownMap);
    $semanticPages = array_slice(array_keys($knownMap), 0, $semanticSetLimit);
    atomic_write_json($semanticFile, [
        'generatedAt' => gmdate('c'),
        'pages' => $semanticPages
    ]);
    atomic_write_json($stateFile, [
        'generatedAt' => gmdate('c')
    ]);

    echo "seeded=" . count($seedPages) . " translated=" . count($translationPages) . " largest=" . count($largestPages) . " hot=" . count($hotPages) . " semantic=" . count($semanticPages) . PHP_EOL;
  warm.php: |
    <?php
    error_reporting(E_ALL);
    date_default_timezone_set('UTC');

    $baseDir = getenv('WARM_CACHE_DIR') ?: '/warm-cache';
    $hotFile = $baseDir . '/hot-pages.json';
    $largestFile = $baseDir . '/largest-pages.json';
    $semanticFile = $baseDir . '/semantic-pages.json';
    $seedFile = $baseDir . '/seed-pages.json';
    $translationFile = $baseDir . '/translation-pages.json';
    $reportFile = $baseDir . '/warm-run.json';
    $warmStateFile = $baseDir . '/warm-state.json';
    $uncacheableFile = $baseDir . '/uncacheable-pages.json';
    $siteServer = rtrim(getenv('SITE_SERVER') ?: 'https://wikiapiary.dobriy.ai', '/');
    $warmBaseUrl = rtrim(getenv('WARM_BASE_URL') ?: $siteServer, '/');
    $warmFanoutHost = getenv('WARM_FANOUT_HOST') ?: '';
    $warmHostHeader = getenv('WARM_HOST_HEADER') ?: '';
    $recentChangesLimit = max(5, (int)(getenv('RECENT_CHANGES_LIMIT') ?: 25));
    $largestBatchSize = max(1, (int)(getenv('LARGEST_BATCH_SIZE') ?: 20));
    $warmPagesLimit = max(5, (int)(getenv('WARM_PAGES_LIMIT') ?: 30));
    $requestTimeout = max(3, (int)(getenv('REQUEST_TIMEOUT_SECONDS') ?: 15));
    $uncacheableTtl = max(300, (int)(getenv('UNCACHEABLE_TTL_SECONDS') ?: 86400));

    function load_json($path, $default) {
        if (!is_file($path)) {
            return $default;
        }
        $data = json_decode((string)file_get_contents($path), true);
        return is_array($data) ? $data : $default;
    }

    function atomic_write_json($path, $data) {
        $tmp = $path . '.tmp';
        file_put_contents($tmp, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
        rename($tmp, $path);
    }

    function wiki_path_from_title($title) {
        $title = str_replace(' ', '_', $title);
        $encoded = rawurlencode($title);
        return '/wiki/' . str_replace(['%2F', '%3A'], ['/', ':'], $encoded);
    }

    function eligible_warm_path($url) {
        if (!is_string($url) || strpos($url, '/wiki/') !== 0) {
            return false;
        }
        if (preg_match('#^/wiki/Special:#', $url)) {
            return false;
        }
        foreach (['/wiki/Template:', '/wiki/Module:', '/wiki/User:', '/wiki/Talk:', '/wiki/File:'] as $blocked) {
            if (strpos($url, $blocked) === 0) {
                return false;
            }
        }
        return true;
    }

    function fetch_json($url, $timeout, array $extraHeaders = []) {
        $ctx = stream_context_create([
            'http' => [
                'timeout' => $timeout,
                'ignore_errors' => true,
                'header' => implode("\r\n", array_merge([
                    'User-Agent: WikiApiaryCacheWarmer/1.0'
                ], $extraHeaders))
            ],
            'ssl' => [
                'verify_peer' => false,
                'verify_peer_name' => false
            ]
        ]);
        $data = @file_get_contents($url, false, $ctx);
        if ($data === false) {
            return [];
        }
        $json = json_decode($data, true);
        return is_array($json) ? $json : [];
    }

    function parse_response_headers($headers) {
        $parsed = [];
        foreach ($headers as $header) {
            $pos = strpos($header, ':');
            if ($pos === false) {
                continue;
            }
            $name = strtolower(trim(substr($header, 0, $pos)));
            $value = trim(substr($header, $pos + 1));
            $parsed[$name][] = $value;
        }
        return $parsed;
    }

    function request_url($fullUrl, $timeout, $method = 'GET', array $extraHeaders = []) {
        $attempts = 3;
        $last = [
            'url' => $fullUrl,
            'status' => 0,
            'ok' => false,
            'seconds' => null,
            'age' => null,
            'via' => [],
            'cacheControl' => null,
        ];
        for ($attempt = 0; $attempt < $attempts; $attempt++) {
            $ctx = stream_context_create([
                'http' => [
                    'method' => $method,
                    'timeout' => $timeout,
                    'ignore_errors' => true,
                    'header' => implode("\r\n", array_merge([
                        'User-Agent: WikiApiaryCacheWarmer/1.0',
                        'Accept: text/html,application/xhtml+xml',
                        'Accept-Language: en'
                    ], $extraHeaders))
                ],
                'ssl' => [
                    'verify_peer' => false,
                    'verify_peer_name' => false
                ]
            ]);
            $start = microtime(true);
            $body = @file_get_contents($fullUrl, false, $ctx);
            $elapsed = microtime(true) - $start;
            $status = 0;
            if (isset($http_response_header[0]) && preg_match('#\s(\d{3})\s#', $http_response_header[0], $m)) {
                $status = (int)$m[1];
            }
            $headers = parse_response_headers($http_response_header ?? []);
            $age = null;
            if (!empty($headers['age'][0]) && ctype_digit((string)$headers['age'][0])) {
                $age = (int)$headers['age'][0];
            }
            $last = [
                'url' => $fullUrl,
                'status' => $status,
                'ok' => $body !== false && $status >= 200 && $status < 400,
                'seconds' => round($elapsed, 3),
                'age' => $age,
                'via' => $headers['via'] ?? [],
                'cacheControl' => $headers['cache-control'][0] ?? null,
            ];
            if (!empty($last['ok'])) {
                return $last;
            }
            if ($attempt < ($attempts - 1)) {
                usleep(200000);
            }
        }
        return $last;
    }

    function expand_base_targets($baseUrl, $fanoutHost) {
        $targets = [$baseUrl];
        if ($fanoutHost === '') {
            return $targets;
        }
        $ips = @gethostbynamel($fanoutHost);
        if (!$ips || !is_array($ips)) {
            return $targets;
        }
        $parts = parse_url($baseUrl);
        $scheme = $parts['scheme'] ?? 'http';
        $port = isset($parts['port']) ? ':' . $parts['port'] : '';
        $path = rtrim($parts['path'] ?? '', '/');
        $expanded = [];
        foreach (array_values(array_unique($ips)) as $ip) {
            $expanded[] = $scheme . '://' . $ip . $port . $path;
        }
        return $expanded ?: $targets;
    }

    $seedPages = load_json($seedFile, ['pages' => []])['pages'] ?? [];
    $translationPages = load_json($translationFile, ['pages' => []])['pages'] ?? [];
    $hotPages = load_json($hotFile, ['pages' => []])['pages'] ?? [];
    $largestPages = load_json($largestFile, ['pages' => []])['pages'] ?? [];
    $semanticPages = load_json($semanticFile, ['pages' => []])['pages'] ?? [];
    $warmState = load_json($warmStateFile, []);
    $uncacheableMap = load_json($uncacheableFile, ['pages' => []])['pages'] ?? [];
    $now = time();
    foreach ($uncacheableMap as $path => $until) {
        if (!is_numeric($until) || (int)$until <= $now) {
            unset($uncacheableMap[$path]);
        } else {
            $uncacheableMap[$path] = (int)$until;
        }
    }

    $warmHeaders = [];
    if ($warmHostHeader !== '') {
        $warmHeaders[] = 'Host: ' . $warmHostHeader;
    }
    $warmTargets = expand_base_targets($warmBaseUrl, $warmFanoutHost);

    $recentChanges = fetch_json(
        $warmBaseUrl . '/w/api.php?action=query&list=recentchanges&rcnamespace=0&rclimit=' . $recentChangesLimit . '&rcprop=title|ids|timestamp&format=json',
        $requestTimeout,
        $warmHeaders
    );
    $changedPages = [];
    foreach (($recentChanges['query']['recentchanges'] ?? []) as $change) {
        if (($change['type'] ?? '') === 'log') {
            continue;
        }
        if (!isset($change['title'])) {
            continue;
        }
        $changedPages[] = wiki_path_from_title($change['title']);
    }

    $largestBatch = [];
    $largestCount = count($largestPages);
    $largestOffset = (int)($warmState['largestOffset'] ?? 0);
    if ($largestCount > 0) {
        $limit = min($largestBatchSize, $largestCount);
        for ($i = 0; $i < $limit; $i++) {
            $largestBatch[] = $largestPages[($largestOffset + $i) % $largestCount];
        }
        $largestOffset = ($largestOffset + $limit) % $largestCount;
    }
    atomic_write_json($warmStateFile, [
        'generatedAt' => gmdate('c'),
        'largestOffset' => $largestOffset
    ]);

    $tier1Pages = ['/', '/wiki/Main_Page', '/wiki/Websites', '/wiki/Websites/WikiTeam'];
    $tier1Pages = array_values(array_unique(array_merge($tier1Pages, $translationPages)));
    $tier2Pages = array_values(array_unique(array_merge($changedPages, $hotPages)));
    $tier3Pages = array_values(array_unique(array_merge($semanticPages, $seedPages, $largestBatch)));

    $ordered = [];
    foreach ([$tier1Pages, $tier2Pages, $tier3Pages] as $group) {
        foreach ($group as $url) {
            if (!isset($ordered[$url]) && eligible_warm_path($url) && !isset($uncacheableMap[$url])) {
                $ordered[$url] = true;
            }
        }
    }
    $targets = array_slice(array_keys($ordered), 0, $warmPagesLimit);

    $results = [];
    foreach ($targets as $path) {
        $targetResults = [];
        $allOk = true;
        foreach ($warmTargets as $base) {
            $refresh = request_url($base . $path, $requestTimeout, 'GET', $warmHeaders);
            $targetResults[] = array_merge(['base' => $base], $refresh);
            if (empty($refresh['ok'])) {
                $allOk = false;
            }
        }
        $primary = $targetResults[0] ?? ['status' => 0, 'cacheControl' => null, 'seconds' => null, 'age' => null];
        $cacheControl = strtolower((string)($primary['cacheControl'] ?? ''));
        if (($primary['status'] ?? 0) === 404) {
            $uncacheableMap[$path] = time() + $uncacheableTtl;
        } elseif ($cacheControl !== '' && (strpos($cacheControl, 'no-store') !== false || strpos($cacheControl, 'private') !== false)) {
            $uncacheableMap[$path] = time() + $uncacheableTtl;
        }
        $results[] = [
            'url' => $siteServer . $path,
            'path' => $path,
            'refresh' => $primary,
            'targetResults' => $targetResults,
            'action' => 'warm',
            'ok' => $allOk,
            'seconds' => $primary['seconds'] ?? null,
            'ageAfter' => $primary['age'] ?? null
        ];
        usleep(150000);
    }

    atomic_write_json($reportFile, [
        'generatedAt' => gmdate('c'),
        'largestBatchOffsetNext' => $largestOffset,
        'tier1Pages' => $tier1Pages,
        'tier2Pages' => $tier2Pages,
        'tier3Pages' => $tier3Pages,
        'largestBatch' => $largestBatch,
        'translationPages' => $translationPages,
        'targets' => $targets,
        'results' => $results
    ]);
    atomic_write_json($uncacheableFile, [
        'generatedAt' => gmdate('c'),
        'pages' => $uncacheableMap
    ]);

    $ok = 0;
    foreach ($results as $result) {
        if (!empty($result['ok'])) {
            $ok++;
        }
    }
    echo "warmed=" . count($results) . " ok=" . $ok . PHP_EOL;
  run-discover.sh: |
    #!/bin/sh
    set -eu
    php /scripts/discover.php
  run-warm.sh: |
    #!/bin/sh
    set -eu
    php /scripts/warm.php
  worker.php: |
    <?php
    error_reporting(E_ALL);
    date_default_timezone_set('UTC');

    $baseDir = getenv('WARM_CACHE_DIR') ?: '/warm-cache';
    $siteServer = rtrim(getenv('SITE_SERVER') ?: 'https://wikiapiary.dobriy.ai', '/');
    $siteHost = getenv('SITE_HOST') ?: parse_url($siteServer, PHP_URL_HOST);
    $priorityQueueFile = $baseDir . '/rewarm-priority.ndjson';
    $queueFile = $baseDir . '/rewarm-queue.ndjson';
    $largestFile = $baseDir . '/largest-pages.json';
    $translationFile = $baseDir . '/translation-pages.json';
    $uncacheableFile = $baseDir . '/uncacheable-pages.json';
    $workerStateFile = $baseDir . '/rewarm-worker-state.json';
    $startupStampFile = $baseDir . '/varnish-startup.stamp';
    $warmBaseUrl = rtrim(getenv('WARM_BASE_URL') ?: $siteServer, '/');
    $warmFanoutHost = getenv('WARM_FANOUT_HOST') ?: '';
    $warmHostHeader = getenv('WARM_HOST_HEADER') ?: '';
    $pollSeconds = max(3, (int)(getenv('QUEUE_POLL_SECONDS') ?: 10));
    $queueBatchSize = max(5, (int)(getenv('QUEUE_BATCH_SIZE') ?: 60));
    $requestTimeout = max(3, (int)(getenv('REQUEST_TIMEOUT_SECONDS') ?: 15));
    $tier1RefreshSeconds = max(60, (int)(getenv('TIER1_REFRESH_SECONDS') ?: 900));
    $uncacheableTtl = max(300, (int)(getenv('UNCACHEABLE_TTL_SECONDS') ?: 86400));

    @mkdir($baseDir, 0775, true);

    function load_json($path, $default) {
        if (!is_file($path)) {
            return $default;
        }
        $data = json_decode((string)file_get_contents($path), true);
        return is_array($data) ? $data : $default;
    }

    function atomic_write_json($path, $data) {
        $tmp = $path . '.tmp';
        file_put_contents($tmp, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
        rename($tmp, $path);
    }

    function eligible_warm_path($url) {
        if (!is_string($url) || $url === '') {
            return false;
        }
        if ($url === '/') {
            return true;
        }
        if (strpos($url, '/wiki/') !== 0) {
            return false;
        }
        if (preg_match('#^/wiki/Special:#', $url)) {
            return false;
        }
        foreach (['/wiki/Template:', '/wiki/Module:', '/wiki/User:', '/wiki/Talk:', '/wiki/File:'] as $blocked) {
            if (strpos($url, $blocked) === 0) {
                return false;
            }
        }
        return true;
    }

    function parse_response_headers($headers) {
        $parsed = [];
        foreach ($headers as $header) {
            $pos = strpos($header, ':');
            if ($pos === false) {
                continue;
            }
            $name = strtolower(trim(substr($header, 0, $pos)));
            $value = trim(substr($header, $pos + 1));
            $parsed[$name][] = $value;
        }
        return $parsed;
    }

    function request_url($fullUrl, $timeout, array $extraHeaders = []) {
        $attempts = 3;
        $last = [
            'url' => $fullUrl,
            'status' => 0,
            'ok' => false,
            'seconds' => null,
            'age' => null,
            'via' => [],
            'cacheControl' => null,
            'cache' => null,
        ];
        for ($attempt = 0; $attempt < $attempts; $attempt++) {
            $ctx = stream_context_create([
                'http' => [
                    'method' => 'GET',
                    'timeout' => $timeout,
                    'ignore_errors' => true,
                    'header' => implode("\r\n", array_merge([
                        'User-Agent: WikiApiaryRewarmWorker/1.0',
                        'Accept: text/html,application/xhtml+xml',
                        'Accept-Language: en'
                    ], $extraHeaders))
                ],
                'ssl' => [
                    'verify_peer' => false,
                    'verify_peer_name' => false
                ]
            ]);
            $start = microtime(true);
            $body = @file_get_contents($fullUrl, false, $ctx);
            $elapsed = microtime(true) - $start;
            $status = 0;
            if (isset($http_response_header[0]) && preg_match('#\s(\d{3})\s#', $http_response_header[0], $m)) {
                $status = (int)$m[1];
            }
            $headers = parse_response_headers($http_response_header ?? []);
            $age = null;
            if (!empty($headers['age'][0]) && ctype_digit((string)$headers['age'][0])) {
                $age = (int)$headers['age'][0];
            }
            $last = [
                'url' => $fullUrl,
                'status' => $status,
                'ok' => $body !== false && $status >= 200 && $status < 400,
                'seconds' => round($elapsed, 3),
                'age' => $age,
                'via' => $headers['via'] ?? [],
                'cacheControl' => $headers['cache-control'][0] ?? null,
                'cache' => $headers['x-wikiapiary-cache'][0] ?? null,
            ];
            if (!empty($last['ok'])) {
                return $last;
            }
            if ($attempt < ($attempts - 1)) {
                usleep(200000);
            }
        }
        return $last;
    }

    function expand_base_targets($baseUrl, $fanoutHost) {
        $targets = [$baseUrl];
        if ($fanoutHost === '') {
            return $targets;
        }
        $ips = @gethostbynamel($fanoutHost);
        if (!$ips || !is_array($ips)) {
            return $targets;
        }
        $parts = parse_url($baseUrl);
        $scheme = $parts['scheme'] ?? 'http';
        $port = isset($parts['port']) ? ':' . $parts['port'] : '';
        $path = rtrim($parts['path'] ?? '', '/');
        $expanded = [];
        foreach (array_values(array_unique($ips)) as $ip) {
            $expanded[] = $scheme . '://' . $ip . $port . $path;
        }
        return $expanded ?: $targets;
    }

    function append_queue_items($queueFile, array $entries, $reason) {
        if (!$entries) {
            return 0;
        }
        $fp = fopen($queueFile, 'c+');
        if (!$fp) {
            return 0;
        }
        flock($fp, LOCK_EX);
        fseek($fp, 0, SEEK_END);
        $written = 0;
        foreach ($entries as $entry) {
            $path = '';
            $attempt = 0;
            $baseUrl = null;
            $hostHeader = null;
            if (is_string($entry)) {
                $path = $entry;
            } elseif (is_array($entry) && !empty($entry['path']) && is_string($entry['path'])) {
                $path = $entry['path'];
                $attempt = max(0, (int)($entry['attempt'] ?? 0));
                $baseUrl = !empty($entry['baseUrl']) && is_string($entry['baseUrl']) ? rtrim($entry['baseUrl'], '/') : null;
                $hostHeader = !empty($entry['hostHeader']) && is_string($entry['hostHeader']) ? $entry['hostHeader'] : null;
            }
            if (!eligible_warm_path($path)) {
                continue;
            }
            $payload = [
                'path' => $path,
                'reason' => $reason,
                'attempt' => $attempt,
                'ts' => gmdate('c')
            ];
            if ($baseUrl) {
                $payload['baseUrl'] = $baseUrl;
            }
            if ($hostHeader) {
                $payload['hostHeader'] = $hostHeader;
            }
            fwrite($fp, json_encode($payload, JSON_UNESCAPED_SLASHES) . "\n");
            $written++;
        }
        fflush($fp);
        flock($fp, LOCK_UN);
        fclose($fp);
        return $written;
    }

    function drain_queue($queueFile, $limit) {
        $fp = fopen($queueFile, 'c+');
        if (!$fp) {
            return [];
        }
        flock($fp, LOCK_EX);
        rewind($fp);
        $lines = stream_get_contents($fp);
        $entries = preg_split('/\r?\n/', trim((string)$lines));
        $items = [];
        $rest = [];
        foreach ($entries as $line) {
            if ($line === '') {
                continue;
            }
            $entry = json_decode($line, true);
            if (!is_array($entry) || empty($entry['path']) || !eligible_warm_path($entry['path'])) {
                continue;
            }
            if (count($items) < $limit) {
                $items[] = $entry;
            } else {
                $rest[] = $line;
            }
        }
        ftruncate($fp, 0);
        rewind($fp);
        if ($rest) {
            fwrite($fp, implode("\n", $rest) . "\n");
        }
        fflush($fp);
        flock($fp, LOCK_UN);
        fclose($fp);
        return $items;
    }

    function tier1_core_pages($baseDir) {
        $translationPages = load_json($baseDir . '/translation-pages.json', ['pages' => []])['pages'] ?? [];
        $pages = array_merge(
            ['/', '/wiki/Main_Page', '/wiki/Websites', '/wiki/Websites/WikiTeam'],
            $translationPages
        );
        $unique = [];
        foreach ($pages as $path) {
            if (eligible_warm_path($path) && !isset($unique[$path])) {
                $unique[$path] = true;
            }
        }
        return array_keys($unique);
    }

    function tier1_largest_pages($baseDir) {
        $largestPages = load_json($baseDir . '/largest-pages.json', ['pages' => []])['pages'] ?? [];
        $unique = [];
        foreach ($largestPages as $path) {
            if (eligible_warm_path($path) && !isset($unique[$path])) {
                $unique[$path] = true;
            }
        }
        return array_keys($unique);
    }

    $state = load_json($workerStateFile, []);
    $lastTier1At = (int)($state['lastTier1At'] ?? 0);
    $lastStartupStamp = (string)($state['lastStartupStamp'] ?? '');

    while (true) {
        $now = time();
        $uncacheableMap = load_json($uncacheableFile, ['pages' => []])['pages'] ?? [];
        foreach ($uncacheableMap as $path => $until) {
            if (!is_numeric($until) || (int)$until <= $now) {
                unset($uncacheableMap[$path]);
            } else {
                $uncacheableMap[$path] = (int)$until;
            }
        }

        $startupStampRaw = is_file($startupStampFile) ? trim((string)@file_get_contents($startupStampFile)) : '';
        $startupStamp = $startupStampRaw;
        $startupPodBaseUrl = null;
        if ($startupStampRaw !== '') {
            $decodedStamp = json_decode($startupStampRaw, true);
            if (is_array($decodedStamp)) {
                $startupStamp = (string)($decodedStamp['stamp'] ?? '');
                if (!empty($decodedStamp['podIp']) && is_string($decodedStamp['podIp'])) {
                    $startupPodBaseUrl = 'http://' . $decodedStamp['podIp'];
                }
            }
        }
        if ($startupStamp !== '' && $startupStamp !== $lastStartupStamp) {
            $priorityTier = array_values(array_diff(tier1_core_pages($baseDir), array_keys($uncacheableMap)));
            $bulkTier = array_values(array_diff(tier1_largest_pages($baseDir), array_keys($uncacheableMap)));
            $priorityCount = append_queue_items($priorityQueueFile, $priorityTier, 'varnish-startup-priority');
            $bulkCount = append_queue_items($queueFile, $bulkTier, 'varnish-startup-largest');
            echo gmdate('c') . " startup stamp changed, queued priority={$priorityCount} largest={$bulkCount}\n";
            $lastStartupStamp = $startupStamp;
        }

        if (($now - $lastTier1At) >= $tier1RefreshSeconds) {
            $priorityTier = array_values(array_diff(tier1_core_pages($baseDir), array_keys($uncacheableMap)));
            $bulkTier = array_values(array_diff(tier1_largest_pages($baseDir), array_keys($uncacheableMap)));
            $priorityCount = append_queue_items($priorityQueueFile, $priorityTier, 'tier1-refresh-priority');
            $bulkCount = append_queue_items($queueFile, $bulkTier, 'tier1-refresh-largest');
            echo gmdate('c') . " periodic tier1 refresh queued priority={$priorityCount} largest={$bulkCount}\n";
            $lastTier1At = $now;
        }

        $items = drain_queue($priorityQueueFile, $queueBatchSize);
        $queueKind = 'priority';
        if (!$items) {
            $items = drain_queue($queueFile, $queueBatchSize);
            $queueKind = 'normal';
        }
        if (!$items) {
            atomic_write_json($workerStateFile, [
                'generatedAt' => gmdate('c'),
                'lastTier1At' => $lastTier1At,
                'lastStartupStamp' => $lastStartupStamp
            ]);
            sleep($pollSeconds);
            continue;
        }

        $seen = [];
        $processed = 0;
        foreach ($items as $entry) {
            $path = $entry['path'];
            if (isset($seen[$path]) || isset($uncacheableMap[$path])) {
                continue;
            }
            $seen[$path] = true;
            $attempt = max(0, (int)($entry['attempt'] ?? 0));
            $baseTargets = [];
            if (!empty($entry['baseUrl']) && is_string($entry['baseUrl'])) {
                $baseTargets = [rtrim($entry['baseUrl'], '/')];
            } else {
                $baseTargets = expand_base_targets($warmBaseUrl, $warmFanoutHost);
            }
            $headers = [];
            if (!empty($entry['hostHeader']) && is_string($entry['hostHeader'])) {
                $headers[] = 'Host: ' . $entry['hostHeader'];
            } elseif ($warmHostHeader !== '') {
                $headers[] = 'Host: ' . $warmHostHeader;
            }
            $primaryRefresh = null;
            $allOk = true;
            foreach ($baseTargets as $baseUrl) {
                $refresh = request_url($baseUrl . $path, $requestTimeout, $headers);
                if ($primaryRefresh === null) {
                    $primaryRefresh = $refresh;
                }
                if (empty($refresh['ok'])) {
                    $allOk = false;
                }
                echo gmdate('c') . " queue={$queueKind} path={$path} reason=" . ($entry['reason'] ?? 'queue') .
                    " attempt={$attempt}" .
                    " base=" . $baseUrl .
                    " status=" . ($refresh['status'] ?? 0) .
                    " cache=" . ($refresh['cache'] ?? '-') .
                    " age=" . (($refresh['age'] ?? '') === null ? '-' : $refresh['age']) .
                    " seconds=" . ($refresh['seconds'] ?? '-') . "\n";
            }
            $refresh = $primaryRefresh ?: ['status' => 0, 'cacheControl' => null];
            $cacheControl = strtolower((string)($refresh['cacheControl'] ?? ''));
            if (($refresh['status'] ?? 0) === 404) {
                $uncacheableMap[$path] = time() + $uncacheableTtl;
            } elseif ($cacheControl !== '' && (strpos($cacheControl, 'no-store') !== false || strpos($cacheControl, 'private') !== false)) {
                $uncacheableMap[$path] = time() + $uncacheableTtl;
            } elseif (!$allOk && $attempt < 2) {
                append_queue_items($queueKind === 'priority' ? $priorityQueueFile : $queueFile, [[
                    'path' => $path,
                    'attempt' => $attempt + 1,
                    'baseUrl' => $entry['baseUrl'] ?? null,
                    'hostHeader' => $entry['hostHeader'] ?? null,
                ]], ($entry['reason'] ?? 'queue') . '-retry');
            }
            $processed++;
            usleep(100000);
        }

        atomic_write_json($uncacheableFile, [
            'generatedAt' => gmdate('c'),
            'pages' => $uncacheableMap
        ]);
        atomic_write_json($workerStateFile, [
            'generatedAt' => gmdate('c'),
            'lastTier1At' => $lastTier1At,
            'lastStartupStamp' => $lastStartupStamp,
            'lastProcessedCount' => $processed
        ]);
    }
  run-worker.sh: |
    #!/bin/sh
    set -eu
    php /scripts/worker.php
{{- end }}
