{{- if .Values.cacheWarmer.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "canasta.fullname" . }}-cache-warmer
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
data:
  discover.php: |
    <?php
    error_reporting(E_ALL);
    date_default_timezone_set('UTC');

    $baseDir = getenv('WARM_CACHE_DIR') ?: '/warm-cache';
    $accessLog = getenv('ACCESS_LOG_FILE') ?: $baseDir . '/access.log';
    $hotFile = $baseDir . '/hot-pages.json';
    $largestFile = $baseDir . '/largest-pages.json';
    $semanticFile = $baseDir . '/semantic-pages.json';
    $seedFile = $baseDir . '/seed-pages.json';
    $stateFile = $baseDir . '/discovery-state.json';
    $siteServer = rtrim(getenv('SITE_SERVER') ?: 'https://wikiapiary.dobriy.ai', '/');
    $siteHost = getenv('SITE_HOST') ?: parse_url($siteServer, PHP_URL_HOST);
    $accessTail = max(100, (int)(getenv('ACCESS_LOG_TAIL') ?: 4000));
    $biggestWikisLimit = max(10, (int)(getenv('BIGGEST_WIKIS_LIMIT') ?: 100));
    $hotLimit = max(10, (int)(getenv('HOT_PAGES_LIMIT') ?: 80));
    $semanticLimit = max(10, (int)(getenv('SEMANTIC_DISCOVERY_LIMIT') ?: 40));
    $semanticSetLimit = max(20, (int)(getenv('SEMANTIC_SET_LIMIT') ?: 200));
    $requestTimeout = max(3, (int)(getenv('REQUEST_TIMEOUT_SECONDS') ?: 15));

    @mkdir($baseDir, 0775, true);

    function atomic_write_json($path, $data) {
        $tmp = $path . '.tmp';
        file_put_contents($tmp, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
        rename($tmp, $path);
    }

    function load_json($path, $default) {
        if (!is_file($path)) {
            return $default;
        }
        $data = json_decode((string)file_get_contents($path), true);
        return is_array($data) ? $data : $default;
    }

    function tail_lines($path, $limit) {
        if (!is_file($path)) {
            return [];
        }
        $lines = [];
        $fp = fopen($path, 'r');
        if (!$fp) {
            return [];
        }
        while (($line = fgets($fp)) !== false) {
            $lines[] = rtrim($line, "\r\n");
            if (count($lines) > $limit) {
                array_shift($lines);
            }
        }
        fclose($fp);
        return $lines;
    }

    function should_skip_ua($ua) {
        if (!is_string($ua) || $ua === '') {
            return false;
        }
        return (bool)preg_match('/WikiApiaryCacheWarmer|WikiApiaryCacheDiscovery|bot|crawl|spider|slurp|GPTBot|GoogleOther|bingbot|Ahrefs|Semrush|curl\//i', $ua);
    }

    function wiki_path_from_title($title) {
        $title = str_replace(' ', '_', $title);
        $encoded = rawurlencode($title);
        return '/wiki/' . str_replace(['%2F', '%3A'], ['/', ':'], $encoded);
    }

    function eligible_warm_path($url) {
        if (!is_string($url) || strpos($url, '/wiki/') !== 0) {
            return false;
        }
        if (preg_match('#^/wiki/Special:#', $url)) {
            return false;
        }
        foreach ([
            '/wiki/Template:',
            '/wiki/Module:',
            '/wiki/User:',
            '/wiki/Talk:',
            '/wiki/File:',
            '/wiki/Category:',
            '/wiki/Concept:',
            '/wiki/Property:'
        ] as $blocked) {
            if (strpos($url, $blocked) === 0) {
                return false;
            }
        }
        if (preg_match('/(::|[<>{}\[\]])/', $url)) {
            return false;
        }
        return true;
    }

    function fetch_text($url, $timeout) {
        $ctx = stream_context_create([
            'http' => [
                'timeout' => $timeout,
                'ignore_errors' => true,
                'user_agent' => 'WikiApiaryCacheDiscovery/1.0'
            ],
            'ssl' => [
                'verify_peer' => false,
                'verify_peer_name' => false
            ]
        ]);
        $data = @file_get_contents($url, false, $ctx);
        return $data === false ? '' : $data;
    }

    function fetch_json_url($url, $timeout) {
        $data = fetch_text($url, $timeout);
        if ($data === '') {
            return [];
        }
        $json = json_decode($data, true);
        return is_array($json) ? $json : [];
    }

    function discover_seed_pages($siteServer, $timeout) {
        $html = fetch_text($siteServer . '/wiki/Main_Page', $timeout);
        $raw = fetch_text($siteServer . '/wiki/Main_Page?action=raw', $timeout);
        $urls = ['/wiki/Main_Page'];

        if ($html !== '') {
            foreach ([
                '/<div id=[\'"]navwrapper[\'"].*?<\/nav>/s',
                '/<div id="mw-content-text".*?<\/div>\s*<\/div>/s'
            ] as $pattern) {
                if (!preg_match($pattern, $html, $match)) {
                    continue;
                }
                if (preg_match_all('/href="([^"]+)"/', $match[0], $hrefs)) {
                    foreach ($hrefs[1] as $href) {
                        if (strpos($href, '/wiki/') === 0 && eligible_warm_path($href)) {
                            $urls[] = html_entity_decode($href, ENT_QUOTES);
                        }
                    }
                }
            }
        }

        if ($raw !== '' && preg_match_all('/\[\[(.+?)(\|.+?)?\]\]/', $raw, $wikilinks)) {
            foreach ($wikilinks[1] as $target) {
                $target = preg_replace('/^<tvar\|[^>]+>/', '', $target);
                $target = preg_replace('/<\/?>/', '', $target);
                $target = trim($target);
                if ($target === '' || strpos($target, '#') === 0) {
                    continue;
                }
                if (strpos($target, 'Special:MyLanguage/') === 0) {
                    $target = substr($target, strlen('Special:MyLanguage/'));
                }
                if (preg_match('/(::|[<>{}\[\]])/', $target)) {
                    continue;
                }
                $url = wiki_path_from_title($target);
                if (eligible_warm_path($url)) {
                    $urls[] = $url;
                }
            }
        }

        $initial = array_values(array_unique($urls));
        foreach ($initial as $seedUrl) {
            $seedTitle = rawurldecode(substr($seedUrl, strlen('/wiki/')));
            $seedRaw = fetch_text($siteServer . $seedUrl . '?action=raw', $timeout);
            if ($seedRaw === '' || !preg_match_all('/\[\[(.+?)(\|.+?)?\]\]/', $seedRaw, $wikilinks)) {
                continue;
            }
            foreach ($wikilinks[1] as $target) {
                $target = preg_replace('/^<tvar\|[^>]+>/', '', $target);
                $target = preg_replace('/<\/?>/', '', $target);
                $target = trim($target);
                if ($target === '' || strpos($target, '#') === 0) {
                    continue;
                }
                if (strpos($target, 'Special:MyLanguage/') === 0) {
                    $target = substr($target, strlen('Special:MyLanguage/'));
                }
                if (preg_match('/(::|[<>{}\[\]])/', $target)) {
                    continue;
                }

                $isRelated = false;
                if (strpos($target, $seedTitle . '/') === 0 || strpos($target, $seedTitle . ' ') === 0) {
                    $isRelated = true;
                } elseif (strpos($seedTitle, ':') !== false) {
                    $seedNamespace = strstr($seedTitle, ':', true) . ':';
                    if (strpos($target, $seedNamespace) === 0) {
                        $isRelated = true;
                    }
                }

                if (!$isRelated) {
                    continue;
                }

                $url = wiki_path_from_title($target);
                if (eligible_warm_path($url)) {
                    $urls[] = $url;
                }
            }
        }

        $urls = array_values(array_unique($urls));
        sort($urls);
        return $urls;
    }

    $seedPages = discover_seed_pages($siteServer, $requestTimeout);
    atomic_write_json($seedFile, [
        'generatedAt' => gmdate('c'),
        'pages' => $seedPages
    ]);

    $largestScores = [];
    $largestPages = [];
    $largestQuery = rawurlencode('[[Category:Website]] [[Is active::true]]|?Has pages count=total pages|sort=Has pages count|order=desc|limit=' . $biggestWikisLimit);
    $largestData = fetch_json_url(
        $siteServer . '/w/api.php?action=ask&query=' . $largestQuery . '&format=json',
        $requestTimeout
    );
    foreach (($largestData['query']['results'] ?? []) as $result) {
        if (!is_array($result) || empty($result['fulltext'])) {
            continue;
        }
        $url = wiki_path_from_title($result['fulltext']);
        if (!eligible_warm_path($url)) {
            continue;
        }
        $largestPages[] = $url;
        $largestScores[$url] = (int)($result['printouts']['total pages'][0] ?? 0);
    }
    $largestPages = array_values(array_unique($largestPages));
    atomic_write_json($largestFile, [
        'generatedAt' => gmdate('c'),
        'pages' => $largestPages,
        'scores' => $largestScores
    ]);

    $counts = [];
    foreach (tail_lines($accessLog, $accessTail) as $line) {
        $entry = json_decode($line, true);
        if (!is_array($entry)) {
            continue;
        }
        $request = $entry['request'] ?? [];
        $uri = $request['uri'] ?? '';
        $method = strtoupper($request['method'] ?? '');
        $host = $request['host'] ?? '';
        $status = (int)($entry['status'] ?? 0);
        $headers = $request['headers'] ?? [];
        $ua = '';
        if (isset($headers['User-Agent'][0])) {
            $ua = $headers['User-Agent'][0];
        }

        if ($host !== $siteHost || ($method !== 'GET' && $method !== 'HEAD') || $status < 200 || $status >= 400) {
            continue;
        }
        if (should_skip_ua($ua)) {
            continue;
        }
        if (!eligible_warm_path($uri)) {
            continue;
        }
        if (strpos($uri, '?') !== false || strpos($uri, '#') !== false) {
            continue;
        }
        $counts[$uri] = ($counts[$uri] ?? 0) + 1;
    }

    arsort($counts);
    $hotPages = array_slice(array_keys($counts), 0, $hotLimit);
    atomic_write_json($hotFile, [
        'generatedAt' => gmdate('c'),
        'pages' => $hotPages,
        'scores' => array_slice($counts, 0, $hotLimit, true)
    ]);

    $semanticState = load_json($stateFile, []);
    $knownSemantic = load_json($semanticFile, ['pages' => []]);
    $knownMap = [];
    foreach (($knownSemantic['pages'] ?? []) as $url) {
        if (eligible_warm_path($url)) {
            $knownMap[$url] = time();
        }
    }

    $candidates = array_values(array_unique(array_merge($seedPages, array_slice($hotPages, 0, $semanticLimit))));
    foreach ($candidates as $url) {
        $title = substr($url, strlen('/wiki/'));
        $rawUrl = $siteServer . '/wiki/' . $title . '?action=raw';
        $raw = fetch_text($rawUrl, $requestTimeout);
        if ($raw === '' || !eligible_warm_path($url)) {
            continue;
        }
        if (preg_match('/#ask:|#show:|Special:Ask|format=table|format=datatable/i', $raw)) {
            $knownMap[$url] = time();
        }
    }

    arsort($knownMap);
    $semanticPages = array_slice(array_keys($knownMap), 0, $semanticSetLimit);
    atomic_write_json($semanticFile, [
        'generatedAt' => gmdate('c'),
        'pages' => $semanticPages
    ]);
    atomic_write_json($stateFile, [
        'generatedAt' => gmdate('c')
    ]);

    echo "seeded=" . count($seedPages) . " largest=" . count($largestPages) . " hot=" . count($hotPages) . " semantic=" . count($semanticPages) . PHP_EOL;
  warm.php: |
    <?php
    error_reporting(E_ALL);
    date_default_timezone_set('UTC');

    $baseDir = getenv('WARM_CACHE_DIR') ?: '/warm-cache';
    $hotFile = $baseDir . '/hot-pages.json';
    $largestFile = $baseDir . '/largest-pages.json';
    $semanticFile = $baseDir . '/semantic-pages.json';
    $seedFile = $baseDir . '/seed-pages.json';
    $reportFile = $baseDir . '/warm-run.json';
    $siteServer = rtrim(getenv('SITE_SERVER') ?: 'https://wikiapiary.dobriy.ai', '/');
    $recentChangesLimit = max(5, (int)(getenv('RECENT_CHANGES_LIMIT') ?: 25));
    $warmPagesLimit = max(5, (int)(getenv('WARM_PAGES_LIMIT') ?: 30));
    $requestTimeout = max(3, (int)(getenv('REQUEST_TIMEOUT_SECONDS') ?: 15));

    function load_json($path, $default) {
        if (!is_file($path)) {
            return $default;
        }
        $data = json_decode((string)file_get_contents($path), true);
        return is_array($data) ? $data : $default;
    }

    function atomic_write_json($path, $data) {
        $tmp = $path . '.tmp';
        file_put_contents($tmp, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
        rename($tmp, $path);
    }

    function wiki_path_from_title($title) {
        $title = str_replace(' ', '_', $title);
        $encoded = rawurlencode($title);
        return '/wiki/' . str_replace(['%2F', '%3A'], ['/', ':'], $encoded);
    }

    function eligible_warm_path($url) {
        if (!is_string($url) || strpos($url, '/wiki/') !== 0) {
            return false;
        }
        if (preg_match('#^/wiki/Special:#', $url)) {
            return false;
        }
        foreach (['/wiki/Template:', '/wiki/Module:', '/wiki/User:', '/wiki/Talk:', '/wiki/File:'] as $blocked) {
            if (strpos($url, $blocked) === 0) {
                return false;
            }
        }
        return true;
    }

    function fetch_json($url, $timeout) {
        $ctx = stream_context_create([
            'http' => [
                'timeout' => $timeout,
                'ignore_errors' => true,
                'user_agent' => 'WikiApiaryCacheWarmer/1.0'
            ],
            'ssl' => [
                'verify_peer' => false,
                'verify_peer_name' => false
            ]
        ]);
        $data = @file_get_contents($url, false, $ctx);
        if ($data === false) {
            return [];
        }
        $json = json_decode($data, true);
        return is_array($json) ? $json : [];
    }

    function parse_response_headers($headers) {
        $parsed = [];
        foreach ($headers as $header) {
            $pos = strpos($header, ':');
            if ($pos === false) {
                continue;
            }
            $name = strtolower(trim(substr($header, 0, $pos)));
            $value = trim(substr($header, $pos + 1));
            $parsed[$name][] = $value;
        }
        return $parsed;
    }

    function request_url($fullUrl, $timeout, $method = 'GET', array $extraHeaders = []) {
        $ctx = stream_context_create([
            'http' => [
                'method' => $method,
                'timeout' => $timeout,
                'ignore_errors' => true,
                'header' => implode("\r\n", array_merge([
                    'User-Agent: WikiApiaryCacheWarmer/1.0',
                    'Accept: text/html,application/xhtml+xml',
                    'Accept-Language: en'
                ], $extraHeaders))
            ],
            'ssl' => [
                'verify_peer' => false,
                'verify_peer_name' => false
            ]
        ]);
        $start = microtime(true);
        $body = @file_get_contents($fullUrl, false, $ctx);
        $elapsed = microtime(true) - $start;
        $status = 0;
        if (isset($http_response_header[0]) && preg_match('#\s(\d{3})\s#', $http_response_header[0], $m)) {
            $status = (int)$m[1];
        }
        $headers = parse_response_headers($http_response_header ?? []);
        $age = null;
        if (!empty($headers['age'][0]) && ctype_digit((string)$headers['age'][0])) {
            $age = (int)$headers['age'][0];
        }
        return [
            'url' => $fullUrl,
            'status' => $status,
            'ok' => $body !== false && $status >= 200 && $status < 400,
            'seconds' => round($elapsed, 3),
            'age' => $age,
            'via' => $headers['via'] ?? [],
            'cacheControl' => $headers['cache-control'][0] ?? null,
        ];
    }

    $seedPages = load_json($seedFile, ['pages' => []])['pages'] ?? [];
    $hotPages = load_json($hotFile, ['pages' => []])['pages'] ?? [];
    $largestPages = load_json($largestFile, ['pages' => []])['pages'] ?? [];
    $semanticPages = load_json($semanticFile, ['pages' => []])['pages'] ?? [];

    $recentChanges = fetch_json(
        $siteServer . '/w/api.php?action=query&list=recentchanges&rcnamespace=0&rclimit=' . $recentChangesLimit . '&rcprop=title|ids|timestamp&format=json',
        $requestTimeout
    );
    $changedPages = [];
    foreach (($recentChanges['query']['recentchanges'] ?? []) as $change) {
        if (($change['type'] ?? '') === 'log') {
            continue;
        }
        if (!isset($change['title'])) {
            continue;
        }
        $changedPages[] = wiki_path_from_title($change['title']);
    }

    $ordered = [];
    foreach ([$changedPages, $largestPages, $hotPages, $semanticPages, $seedPages] as $group) {
        foreach ($group as $url) {
            if (!isset($ordered[$url]) && eligible_warm_path($url)) {
                $ordered[$url] = true;
            }
        }
    }
    $targets = array_slice(array_keys($ordered), 0, $warmPagesLimit);

    $results = [];
    foreach ($targets as $path) {
        $refresh = request_url($siteServer . $path, $requestTimeout);
        $results[] = [
            'url' => $siteServer . $path,
            'path' => $path,
            'refresh' => $refresh,
            'action' => 'warm',
            'ok' => !empty($refresh['ok']),
            'seconds' => $refresh['seconds'] ?? null,
            'ageAfter' => $refresh['age'] ?? null
        ];
        usleep(150000);
    }

    atomic_write_json($reportFile, [
        'generatedAt' => gmdate('c'),
        'targets' => $targets,
        'results' => $results
    ]);

    $ok = 0;
    foreach ($results as $result) {
        if (!empty($result['ok'])) {
            $ok++;
        }
    }
    echo "warmed=" . count($results) . " ok=" . $ok . PHP_EOL;
  run-discover.sh: |
    #!/bin/sh
    set -eu
    php /scripts/discover.php
  run-warm.sh: |
    #!/bin/sh
    set -eu
    php /scripts/warm.php
{{- end }}
