{{- if not .Values.site.primaryHost }}
  {{- fail "site.primaryHost must be configured in values.yaml" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "canasta.fullname" . }}-web
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "canasta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "canasta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/web-config: {{ .Values.configData.web | toJson | sha256sum }}
        checksum/site-hosts: {{ dict "server" (include "canasta.siteServer" .) "hosts" (include "canasta.hosts" .) | toJson | sha256sum }}
        checksum/env-config: {{ .Values.configData.env | default dict | toJson | sha256sum }}
        {{- if .Values.extensionOverrides.enabled }}
        checksum/extension-overrides: {{ printf "%s%s" (.Files.Get "files/wikiapiary/Stats.php") (.Files.Get "files/wikiapiary/stats-snapshot.json") | sha256sum }}
        {{- end }}
        checksum/php-sessions: {{ toJson .Values.phpSessions | sha256sum }}
    spec:
      {{- $nodeSelector := .Values.web.nodeSelector | default .Values.nodeSelector }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.web.spreadAcrossNodes }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "canasta.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: web
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "canasta.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: web
      {{- end }}
      initContainers:
        - name: assemble-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Copy flat ConfigMap files into /config
              cp /configmap-flat/.env /config/.env 2>/dev/null || true
              cp /configmap-flat/wikis.yaml /config/wikis.yaml 2>/dev/null || true
              cp /configmap-flat/composer.local.json /config/composer.local.json 2>/dev/null || true
              mkdir -p /config/persistent
              cp /configmap-flat/composer-deps-hash /config/persistent/.composer-deps-hash 2>/dev/null || true
              cp /configmap-flat/.smw.json /config/persistent/.smw.json 2>/dev/null || true
              # Reconstruct settings directory tree from double-dash-encoded keys
              for f in /configmap-flat/settings--*; do
                [ -f "$f" ] || continue
                base=$(basename "$f")
                # Convert settings--global--File.php to settings/global/File.php
                relpath=$(echo "$base" | sed 's/--/\//g')
                mkdir -p "/config/$(dirname "$relpath")"
                cp "$f" "/config/$relpath"
              done
              cat > /override-bin/getent <<'EOF'
              #!/bin/sh
              if [ "$1" = "hosts" ] && [ "$2" = "gateway.docker.internal" ]; then
                echo "172.17.0.1 gateway.docker.internal"
                exit 0
              fi
              exec /usr/bin/getent "$@"
              EOF
              chmod +x /override-bin/getent
              echo "Config assembled"
          volumeMounts:
            - name: web-configmap
              mountPath: /configmap-flat
              readOnly: true
            - name: config
              mountPath: /config
            - name: override-bin
              mountPath: /override-bin
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ default "db" .Values.db.hostOverride | quote }} {{ default "3306" .Values.db.portOverride | quote }}; do
                sleep 2
              done
      containers:
        - name: web
          image: {{ include "canasta.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.web.skipStartupUpdate }}
          command:
            - /bin/bash
            - -lc
            - |
              export PATH=/override-bin:$PATH
              sed '/\. \/run-maintenance-scripts\.sh/{n;s/run_autoupdate/if [ "${MW_SKIP_STARTUP_UPDATE:-false}" != "true" ]; then run_autoupdate; else echo "Skipping startup autoupdate because MW_SKIP_STARTUP_UPDATE=$MW_SKIP_STARTUP_UPDATE"; fi/;}' /run-all.sh > /tmp/run-all.sh
              chmod +x /tmp/run-all.sh
              exec /tmp/run-all.sh
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # Runtime knobs from .env come via the envFrom ConfigMap.
          # MW_SITE_SERVER, MW_SITE_FQDN, and CANASTA_ENABLE_VARNISH
          # stay as hardcoded env: entries because they're sourced from
          # values.yaml fields that also drive K8s resources (Ingress
          # hostnames, Varnish deployment gate). config set updates
          # both .env and values.yaml for these keys.
          envFrom:
            - configMapRef:
                name: {{ include "canasta.fullname" . }}-env
                optional: true
            {{- if .Values.mail.existingSecret }}
            - secretRef:
                name: {{ .Values.mail.existingSecret }}
                optional: true
            {{- end }}
          env:
            - name: MW_SITE_SERVER
              value: {{ include "canasta.siteServer" . | quote }}
            - name: MW_SITE_FQDN
              value: {{ include "canasta.primaryHost" . | quote }}
            - name: MW_SITE_HOSTS
              value: {{ include "canasta.hostsCsv" . | quote }}
            - name: MYSQL_HOST
              value: {{ if .Values.db.hostOverride }}{{ .Values.db.hostOverride | quote }}{{ else if .Values.db.enabled }}"db"{{ else }}"{{ .Values.externalDatabase.host }}"{{ end }}
            - name: MYSQL_PORT
              value: {{ if .Values.db.portOverride }}{{ .Values.db.portOverride | quote }}{{ else if .Values.db.enabled }}"3306"{{ else }}"{{ .Values.externalDatabase.port }}"{{ end }}
            - name: MYSQL_USER
              value: {{ if .Values.db.enabled }}"root"{{ else }}"{{ .Values.externalDatabase.user }}"{{ end }}
            - name: MYSQL_SSL
              value: {{ if .Values.db.enabled }}"false"{{ else }}"{{ .Values.externalDatabase.ssl }}"{{ end }}
            - name: USE_EXTERNAL_DB
              value: "{{ not .Values.db.enabled }}"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "canasta.dbSecretName" . }}
                  key: MYSQL_PASSWORD
            - name: MW_WARM_CACHE_DIR
              value: /warm-cache
            - name: MW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "canasta.mwSecretName" . }}
                  key: MW_SECRET_KEY
            - name: CANASTA_ENABLE_VARNISH
              value: "{{ .Values.varnish.enabled }}"
            {{- if .Values.web.skipStartupUpdate }}
            - name: MW_SKIP_STARTUP_UPDATE
              value: "true"
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /mediawiki/config
            - name: images
              mountPath: /mediawiki/images
            - name: cache
              mountPath: /mediawiki/cache
            - name: user-extensions
              mountPath: /var/www/mediawiki/w/user-extensions
            {{- if .Values.extensionOverrides.enabled }}
            - name: extension-overrides
              mountPath: /var/www/mediawiki/w/user-extensions/WikiApiary/includes/data/query/Stats.php
              subPath: Stats.php
            - name: extension-overrides
              mountPath: /var/www/mediawiki/w/user-extensions/WikiApiary/includes/data/query/stats-snapshot.json
              subPath: stats-snapshot.json
            {{- end }}
            - name: user-skins
              mountPath: /var/www/mediawiki/w/user-skins
            - name: public-assets
              mountPath: /mediawiki/public_assets
            - name: cache-warm
              mountPath: /warm-cache
            - name: override-bin
              mountPath: /override-bin
            {{- if .Values.phpSessions.enabled }}
            - name: php-sessions
              mountPath: /etc/php/8.2/apache2/conf.d/99-wikiapiary-sessions.ini
              subPath: 99-wikiapiary-sessions.ini
            - name: php-sessions
              mountPath: /etc/php/8.2/cli/conf.d/99-wikiapiary-sessions.ini
              subPath: 99-wikiapiary-sessions.ini
            {{- end }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 1440
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: web-configmap
          configMap:
            name: {{ include "canasta.fullname" . }}-web-config
            optional: true
        - name: config
          emptyDir: {}
        - name: override-bin
          emptyDir: {}
        - name: images
          persistentVolumeClaim:
            claimName: {{ include "canasta.fullname" . }}-images
        - name: cache
          emptyDir: {}
        - name: user-extensions
          persistentVolumeClaim:
            claimName: {{ include "canasta.fullname" . }}-extensions
        {{- if .Values.extensionOverrides.enabled }}
        - name: extension-overrides
          configMap:
            name: {{ include "canasta.fullname" . }}-extension-overrides
        {{- end }}
        - name: user-skins
          persistentVolumeClaim:
            claimName: {{ include "canasta.fullname" . }}-skins
        - name: public-assets
          persistentVolumeClaim:
            claimName: {{ include "canasta.fullname" . }}-public-assets
        - name: cache-warm
          persistentVolumeClaim:
            claimName: {{ include "canasta.fullname" . }}-cache-warm
        {{- if .Values.phpSessions.enabled }}
        - name: php-sessions
          configMap:
            name: {{ include "canasta.fullname" . }}-php-sessions
        {{- end }}
      hostAliases:
        - ip: "172.17.0.1"
          hostnames:
            - gateway.docker.internal
