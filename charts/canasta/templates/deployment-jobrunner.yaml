{{- if .Values.jobrunner.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "canasta.fullname" . }}-jobrunner
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: jobrunner
spec:
  replicas: {{ .Values.jobrunner.replicaCount }}
  selector:
    matchLabels:
      {{- include "canasta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: jobrunner
  template:
    metadata:
      labels:
        {{- include "canasta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: jobrunner
      annotations:
        checksum/web-config: {{ .Values.configData.web | toJson | sha256sum }}
        checksum/site-hosts: {{ dict "server" (include "canasta.siteServer" .) "hosts" (include "canasta.hosts" .) | toJson | sha256sum }}
        checksum/env-config: {{ .Values.configData.env | default dict | toJson | sha256sum }}
        checksum/php-sessions: {{ toJson .Values.phpSessions | sha256sum }}
    spec:
      {{- $nodeSelector := .Values.jobrunner.nodeSelector | default .Values.nodeSelector }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: assemble-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /configmap-flat/.env /config/.env 2>/dev/null || true
              cp /configmap-flat/wikis.yaml /config/wikis.yaml 2>/dev/null || true
              cp /configmap-flat/composer.local.json /config/composer.local.json 2>/dev/null || true
              mkdir -p /config/persistent
              cp /configmap-flat/composer-deps-hash /config/persistent/.composer-deps-hash 2>/dev/null || true
              cp /configmap-flat/.smw.json /config/persistent/.smw.json 2>/dev/null || true
              for f in /configmap-flat/settings--*; do
                [ -f "$f" ] || continue
                base=$(basename "$f")
                relpath=$(echo "$base" | sed 's/--/\//g')
                mkdir -p "/config/$(dirname "$relpath")"
                cp "$f" "/config/$relpath"
              done
          env:
            - name: MW_AUTOUPDATE
              value: "false"
          volumeMounts:
            - name: web-configmap
              mountPath: /configmap-flat
              readOnly: true
            - name: config
              mountPath: /config
      containers:
        - name: jobrunner
          image: {{ include "canasta.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              mkdir -p /mediawiki/cache/main && chown -R www-data:www-data /mediawiki/cache || true
              while true; do
                php maintenance/runJobs.php {{ .Values.jobrunner.runJobsArgs }}
                sleep 5
              done
          # See deployment-web.yaml for the full explanation of the
          # env-vs-envFrom split. The jobrunner shares the same env
          # ConfigMap as the web pod because maintenance scripts and job
          # processing need the same runtime knobs (PHP_*, wiki directory,
          # very short URLs, etc.).
          envFrom:
            - configMapRef:
                name: {{ include "canasta.fullname" . }}-env
                optional: true
            {{- if .Values.mail.existingSecret }}
            - secretRef:
                name: {{ .Values.mail.existingSecret }}
                optional: true
            {{- end }}
          env:
            - name: MW_SITE_SERVER
              value: {{ include "canasta.siteServer" . | quote }}
            - name: MW_SITE_FQDN
              value: {{ include "canasta.primaryHost" . | quote }}
            - name: MW_SITE_HOSTS
              value: {{ include "canasta.hostsCsv" . | quote }}
            - name: MYSQL_HOST
              value: {{ if .Values.db.hostOverride }}{{ .Values.db.hostOverride | quote }}{{ else if .Values.db.enabled }}"db"{{ else }}"{{ .Values.externalDatabase.host }}"{{ end }}
            - name: MYSQL_PORT
              value: {{ if .Values.db.portOverride }}{{ .Values.db.portOverride | quote }}{{ else if .Values.db.enabled }}"3306"{{ else }}"{{ .Values.externalDatabase.port }}"{{ end }}
            - name: MYSQL_USER
              value: {{ if .Values.db.enabled }}"root"{{ else }}"{{ .Values.externalDatabase.user }}"{{ end }}
            - name: MYSQL_SSL
              value: {{ if .Values.db.enabled }}"false"{{ else }}"{{ .Values.externalDatabase.ssl }}"{{ end }}
            - name: USE_EXTERNAL_DB
              value: "{{ not .Values.db.enabled }}"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "canasta.dbSecretName" . }}
                  key: MYSQL_PASSWORD
            - name: MW_WARM_CACHE_DIR
              value: /warm-cache
            - name: MW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "canasta.mwSecretName" . }}
                  key: MW_SECRET_KEY
            - name: MW_AUTOUPDATE
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /mediawiki/config
              readOnly: true
            - name: images
              mountPath: /mediawiki/images
            - name: cache
              mountPath: /mediawiki/cache
            - name: cache-warm
              mountPath: /warm-cache
            {{- if .Values.phpSessions.enabled }}
            - name: php-sessions
              mountPath: /etc/php/8.2/cli/conf.d/99-wikiapiary-sessions.ini
              subPath: 99-wikiapiary-sessions.ini
            {{- end }}
          {{- with .Values.jobrunner.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: web-configmap
          configMap:
            name: {{ include "canasta.fullname" . }}-web-config
            optional: true
        - name: config
          emptyDir: {}
        - name: images
          persistentVolumeClaim:
            claimName: {{ include "canasta.fullname" . }}-images
        - name: cache
          emptyDir: {}
        - name: cache-warm
          persistentVolumeClaim:
            claimName: {{ include "canasta.fullname" . }}-cache-warm
        {{- if .Values.phpSessions.enabled }}
        - name: php-sessions
          configMap:
            name: {{ include "canasta.fullname" . }}-php-sessions
        {{- end }}
{{- end }}
