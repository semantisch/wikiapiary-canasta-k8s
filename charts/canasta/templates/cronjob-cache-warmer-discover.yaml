{{- if .Values.cacheWarmer.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "canasta.fullname" . }}-cache-discover
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache-warmer
spec:
  schedule: {{ .Values.cacheWarmer.discoverSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "canasta.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: cache-warmer
        spec:
          restartPolicy: Never
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: discover
              image: {{ .Values.cacheWarmer.image | default (include "canasta.image" .) }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/bin/sh", "/scripts/run-discover.sh"]
              env:
                - name: SITE_SERVER
                  value: "https://{{ index .Values.domains 0 }}"
                - name: SITE_HOST
                  value: "{{ index .Values.domains 0 }}"
                - name: DISCOVER_BASE_URL
                  value: "{{ .Values.cacheWarmer.requestBaseUrl }}"
                - name: DISCOVER_HOST_HEADER
                  value: "{{ index .Values.domains 0 }}"
                - name: WARM_CACHE_DIR
                  value: /warm-cache
                - name: ACCESS_LOG_FILE
                  value: /warm-cache/access.log
                - name: ACCESS_LOG_TAIL
                  value: "{{ .Values.cacheWarmer.accessLogTail }}"
                - name: BIGGEST_WIKIS_LIMIT
                  value: "{{ .Values.cacheWarmer.biggestWikisLimit }}"
                - name: HOT_PAGES_LIMIT
                  value: "{{ .Values.cacheWarmer.hotPagesLimit }}"
                - name: SEMANTIC_DISCOVERY_LIMIT
                  value: "{{ .Values.cacheWarmer.semanticDiscoveryLimit }}"
                - name: SEMANTIC_SET_LIMIT
                  value: "{{ .Values.cacheWarmer.semanticSetLimit }}"
                - name: REQUEST_TIMEOUT_SECONDS
                  value: "{{ .Values.cacheWarmer.requestTimeoutSeconds }}"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: cache-warm
                  mountPath: /warm-cache
              {{- with .Values.cacheWarmer.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          volumes:
            - name: scripts
              configMap:
                name: {{ include "canasta.fullname" . }}-cache-warmer
                defaultMode: 0755
            - name: cache-warm
              persistentVolumeClaim:
                claimName: {{ include "canasta.fullname" . }}-cache-warm
{{- end }}
