{{- if .Values.cacheWarmer.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "canasta.fullname" . }}-cache-warm-priority
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache-warmer
spec:
  suspend: {{ .Values.cacheWarmer.suspend }}
  schedule: {{ .Values.cacheWarmer.priorityWarmSchedule | quote }}
  startingDeadlineSeconds: {{ .Values.cacheWarmer.startingDeadlineSeconds }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cacheWarmer.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.cacheWarmer.priorityActiveDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ .Values.cacheWarmer.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            {{- include "canasta.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: cache-warmer
        spec:
          restartPolicy: Never
          {{- $nodeSelector := .Values.cacheWarmer.nodeSelector | default .Values.nodeSelector }}
          {{- with $nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: warm-priority
              image: {{ .Values.cacheWarmer.image | default (include "canasta.image" .) }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/bin/sh", "/scripts/run-warm-priority.sh"]
              env:
                - name: SITE_SERVER
                  value: {{ include "canasta.siteServer" . | quote }}
                - name: WARM_BASE_URL
                  value: "{{ .Values.cacheWarmer.requestBaseUrl }}"
                - name: WARM_FANOUT_HOST
                  value: "{{ .Values.cacheWarmer.warmFanoutHost }}"
                - name: WARM_HOST_HEADER
                  value: {{ include "canasta.primaryHost" . | quote }}
                - name: WARM_HOST_HEADERS
                  value: {{ include "canasta.hostsCsv" . | quote }}
                - name: WARM_CACHE_DIR
                  value: /warm-cache
                - name: PRIORITY_HOT_PAGES_LIMIT
                  value: "{{ .Values.cacheWarmer.priorityHotPagesLimit }}"
                - name: PRIORITY_PAGES_LIMIT
                  value: "{{ .Values.cacheWarmer.priorityPagesLimit }}"
                - name: REQUEST_TIMEOUT_SECONDS
                  value: "{{ .Values.cacheWarmer.requestTimeoutSeconds }}"
                - name: UNCACHEABLE_TTL_SECONDS
                  value: "{{ .Values.cacheWarmer.uncacheableTtlSeconds }}"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: cache-warm
                  mountPath: /warm-cache
              {{- with .Values.cacheWarmer.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          volumes:
            - name: scripts
              configMap:
                name: {{ include "canasta.fullname" . }}-cache-warmer
                defaultMode: 0755
            - name: cache-warm
              persistentVolumeClaim:
                claimName: {{ include "canasta.fullname" . }}-cache-warm
---
