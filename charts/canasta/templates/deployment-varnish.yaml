{{- if .Values.varnish.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "canasta.fullname" . }}-varnish
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: varnish
spec:
  replicas: {{ .Values.varnish.replicaCount }}
  selector:
    matchLabels:
      {{- include "canasta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: varnish
  template:
    metadata:
      labels:
        {{- include "canasta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: varnish
      annotations:
        checksum/varnish-config: {{ dict "custom" .Values.configData.varnish "default" (.Files.Get "files/default.vcl") "primary" (include "canasta.primaryHost" .) | toJson | sha256sum }}
    spec:
      {{- $nodeSelector := .Values.varnish.nodeSelector | default .Values.nodeSelector }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.varnish.spreadAcrossNodes }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "canasta.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: varnish
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "canasta.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: varnish
      {{- end }}
      containers:
        - name: varnish
          image: {{ .Values.varnish.image }}
          env:
            - name: VARNISH_SIZE
              value: {{ .Values.varnish.storageSize | quote }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    mkdir -p /warm-cache
                    printf '{"stamp":"%s-startup","podIp":"%s"}\n' "$(date +%s)" "${POD_IP}" > /warm-cache/varnish-startup.stamp
          volumeMounts:
            - name: varnish-config
              mountPath: /etc/varnish/default.vcl
              subPath: default.vcl
              readOnly: true
            - name: cache-warm
              mountPath: /warm-cache
          {{- with .Values.varnish.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
      volumes:
        - name: varnish-config
          configMap:
            name: {{ include "canasta.fullname" . }}-varnish-config
        - name: cache-warm
          persistentVolumeClaim:
            claimName: {{ include "canasta.fullname" . }}-cache-warm
{{- end }}
